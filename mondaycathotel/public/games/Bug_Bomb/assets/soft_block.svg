<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <radialGradient id="softGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="70%" stop-color="#16a34a" />
            <stop offset="100%" stop-color="#14532d" />
        </radialGradient>
        <filter id="energyGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <!-- 外框 -->
    <rect x="5" y="5" width="90" height="90" rx="8" fill="none" stroke="#4ade80" stroke-width="6" opacity="0.6" filter="url(#energyGlow)" />
    <!-- 內核能量塊 -->
    <rect x="15" y="15" width="70" height="70" rx="5" fill="url(#softGrad)" filter="url(#energyGlow)" />
    <!-- 能量電路紋理 -->
    <path d="M 30 50 L 45 35 L 70 35 M 30 70 L 50 70 L 65 55" fill="none" stroke="#bbf7d0" stroke-width="3" opacity="0.8" filter="url(#energyGlow)" />
</svg>