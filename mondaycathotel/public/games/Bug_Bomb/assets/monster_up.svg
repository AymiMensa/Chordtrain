<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    
    <defs>
        <radialGradient id="enemyGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ff4b2b" />
            <stop offset="50%" stop-color="#ff416c" />
            <stop offset="100%" stop-color="#330000" />
        </radialGradient>
        <filter id="enemyGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.9" />
        </filter>
    </defs>
    <!-- 機械腳 (8腳) -->
    <path d="M 50 50 L 15 15 M 50 50 L 85 15 M 50 50 L 15 85 M 50 50 L 85 85 M 50 50 L 5 50 M 50 50 L 95 50 M 50 50 L 30 5 M 50 50 L 70 5 M 50 50 L 30 95 M 50 50 L 70 95" stroke="#222" stroke-width="8" stroke-linecap="round" filter="url(#mShadow)" />
    <!-- 關節發光 -->
    <path d="M 50 50 L 15 15 M 50 50 L 85 15 M 50 50 L 15 85 M 50 50 L 85 85 M 50 50 L 5 50 M 50 50 L 95 50" stroke="#ff4b2b" stroke-width="2" stroke-linecap="round" filter="url(#enemyGlow)" />
    <!-- 核心球體 -->
    <circle cx="50" cy="50" r="30" fill="url(#enemyGrad)" filter="url(#mShadow)" />
    <!-- 金屬紋理 -->
    <circle cx="50" cy="50" r="30" fill="url(#highlight)" />

    <!-- 背部裝甲排氣孔 -->
    <rect x="40" y="35" width="20" height="30" rx="3" fill="#111" />
    <line x1="42" y1="40" x2="58" y2="40" stroke="#ff4b2b" stroke-width="2" filter="url(#enemyGlow)" />
    <line x1="42" y1="50" x2="58" y2="50" stroke="#ff4b2b" stroke-width="2" filter="url(#enemyGlow)" />
    <line x1="42" y1="60" x2="58" y2="60" stroke="#ff4b2b" stroke-width="2" filter="url(#enemyGlow)" />
</svg>