<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <radialGradient id="bombGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="50%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>
        <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff" />
            <stop offset="40%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#581c87" />
        </radialGradient>
        <filter id="plasmaGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
        </filter>
    </defs>
    <!-- 引信導線 -->
    <path d="M 50 20 Q 60 10 70 15" fill="none" stroke="#fbbf24" stroke-width="4" />
    <circle cx="70" cy="15" r="4" fill="#ef4444" filter="url(#plasmaGlow)" />
    <!-- 炸彈本體 -->
    <circle cx="50" cy="55" r="35" fill="url(#bombGrad)" filter="url(#bShadow)" />
    <!-- 高亮反光 -->
    <circle cx="40" cy="45" r="10" fill="rgba(255,255,255,0.2)" />
    <!-- 發光電漿核心 (隨時要爆發的感覺) -->
    <circle cx="50" cy="55" r="12" fill="url(#plasmaCore)" filter="url(#plasmaGlow)" />
    <circle cx="50" cy="55" r="4" fill="#fff" filter="url(#plasmaGlow)" />
</svg>