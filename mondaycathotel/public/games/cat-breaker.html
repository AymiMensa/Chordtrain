// Rounded-rect path helper
function rrect(x, y, w, h, r) {
  let R = Math.min(r, w/2, h/2);
  cx.beginPath();
  cx.moveTo(x + R, y);
  cx.lineTo(x + w - R, y);        cx.arcTo(x+w, y,   x+w, y+R,   R);
  cx.lineTo(x + w, y + h - R);    cx.arcTo(x+w, y+h, x+w-R, y+h, R);
  cx.lineTo(x + R, y + h);        cx.arcTo(x,   y+h, x,   y+h-R, R);
  cx.lineTo(x, y + R);            cx.arcTo(x,   y,   x+R, y,     R);
  cx.closePath();
}

// ═══════════════════════════════════════════════════
//  PAPER-CRAFT 3D DRAWING FUNCTIONS
// ═══════════════════════════════════════════════════

// ── Shared: cat body + ears path ──────────────────
function pathCatBody(mx, my, bw, bh) {
  let earH = bh * 0.28;
  let top  = my - bh * 0.44;
  let bot  = my + bh * 0.44;
  let R    = Math.min(bw * 0.18, bh * 0.18, 10);
  cx.beginPath();
  // Left ear triangle
  cx.moveTo(mx - bw*0.38, top + earH*0.85);
  cx.lineTo(mx - bw*0.20, top - earH*0.55);
  cx.lineTo(mx - bw*0.04, top + earH*0.85);
  // Top edge (flat between ears)
  cx.lineTo(mx + bw*0.04, top + earH*0.85);
  // Right ear triangle
  cx.lineTo(mx + bw*0.20, top - earH*0.55);
  cx.lineTo(mx + bw*0.38, top + earH*0.85);
  // Body rounded corners
  cx.arcTo(mx + bw*0.44, top + earH*0.85, mx + bw*0.44, top + earH*0.85 + R, R);
  cx.lineTo(mx + bw*0.44, bot - R);
  cx.arcTo(mx + bw*0.44, bot, mx + bw*0.44 - R, bot, R);
  cx.lineTo(mx - bw*0.44 + R, bot);
  cx.arcTo(mx - bw*0.44, bot, mx - bw*0.44, bot - R, R);
  cx.lineTo(mx - bw*0.44, top + earH*0.85 + R);
  cx.arcTo(mx - bw*0.44, top + earH*0.85, mx - bw*0.44 + R, top + earH*0.85, R);
  cx.closePath();
}

// ── Inner ear fill ─────────────────────────────────
function drawInnerEars(mx, my, bw, bh, color) {
  let earH = bh * 0.28;
  let top  = my - bh * 0.44;
  cx.fillStyle = color;
  // Left inner
  cx.beginPath();
  cx.moveTo(mx - bw*0.34, top + earH*0.78);
  cx.lineTo(mx - bw*0.20, top - earH*0.18);
  cx.lineTo(mx - bw*0.08, top + earH*0.78);
  cx.closePath(); cx.fill();
  // Right inner
  cx.beginPath();
  cx.moveTo(mx + bw*0.08, top + earH*0.78);
  cx.lineTo(mx + bw*0.20, top - earH*0.18);
  cx.lineTo(mx + bw*0.34, top + earH*0.78);
  cx.closePath(); cx.fill();
}

// ── Cat face (eyes, nose, whiskers, mouth) ─────────
function drawCatFace(mx, my, bw, bh, pal, hpFrac, isPooping, b) {
  let earH  = bh * 0.28;
  let faceTop = my - bh * 0.44 + earH * 0.9;
  let faceH   = bh * 0.88 - earH * 0.9;
  let eyeY  = faceTop + faceH * 0.30;
  let eyeDX = bw * 0.165;
  let eyeR  = Math.max(2.5, Math.min(bh * 0.12, bw * 0.09));
  let scared = hpFrac < 0.35;
  let mid    = hpFrac < 0.65;
  let scale  = isPooping ? 1.7 : scared ? 1.35 : mid ? 1.1 : 0.92;
  let er     = eyeR * scale;
  let noseY  = faceTop + faceH * 0.58;
  let mouthY = faceTop + faceH * 0.72;
  let ns     = Math.max(2, bh * 0.046);

  // ── Whites ──
  cx.fillStyle = '#fff';
  for (let ex of [mx-eyeDX, mx+eyeDX]) {
    cx.beginPath(); cx.ellipse(ex, eyeY, er*1.12, er, 0, 0, Math.PI*2); cx.fill();
  }
  // ── Iris ring ──
  let irisC = pal.eye || '#44AA66';
  cx.strokeStyle = irisC; cx.lineWidth = Math.max(1, er*0.3);
  for (let ex of [mx-eyeDX, mx+eyeDX]) {
    cx.beginPath(); cx.arc(ex, eyeY, er*0.7, 0, Math.PI*2); cx.stroke();
  }
  // ── Pupils (vertical slit) ──
  let pw = isPooping ? er*0.52 : scared ? er*0.62 : er*0.26;
  cx.fillStyle = '#100808';
  for (let ex of [mx-eyeDX, mx+eyeDX]) {
    cx.beginPath(); cx.ellipse(ex, eyeY, pw, er*0.78, 0, 0, Math.PI*2); cx.fill();
  }
  // ── Eye shine ──
  cx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let ex of [mx-eyeDX, mx+eyeDX]) {
    cx.beginPath(); cx.arc(ex+er*0.28, eyeY-er*0.26, er*0.21, 0, Math.PI*2); cx.fill();
  }
  // ── Nose (heart shape) ──
  cx.fillStyle = '#FF9999';
  cx.beginPath();
  cx.moveTo(mx, noseY + ns);
  cx.lineTo(mx - ns*1.1, noseY - ns*0.1);
  cx.lineTo(mx + ns*1.1, noseY - ns*0.1);
  cx.closePath(); cx.fill();
  // ── Philtrum ──
  cx.strokeStyle = '#66666640'; cx.lineWidth = Math.max(0.5, bh*0.018);
  cx.beginPath(); cx.moveTo(mx, noseY+ns); cx.lineTo(mx, mouthY-ns*0.2); cx.stroke();
  // ── Mouth ──
  cx.strokeStyle = '#333'; cx.lineWidth = Math.max(1, bh*0.03); cx.lineCap='round';
  if (isPooping) {
    // Strained squiggle
    cx.beginPath();
    cx.moveTo(mx-ns*2, mouthY);
    cx.quadraticCurveTo(mx-ns, mouthY-ns, mx, mouthY+ns*0.5);
    cx.quadraticCurveTo(mx+ns, mouthY+ns*1.5, mx+ns*2, mouthY);
    cx.stroke();
    // Effort lines
    cx.strokeStyle='#FF6644'; cx.lineWidth=Math.max(0.8,bh*0.022);
    for (let sign of [-1,1]) {
      cx.beginPath();
      cx.moveTo(mx+sign*eyeDX*1.5, eyeY-er*0.5);
      cx.lineTo(mx+sign*eyeDX*1.9, eyeY-er*1.1);
      cx.stroke();
    }
  } else if (!scared && !mid) {
    // Happy W-mouth + blush
    cx.beginPath();
    cx.moveTo(mx-ns*2.2, mouthY-ns*0.4);
    cx.quadraticCurveTo(mx-ns*0.7, mouthY+ns*1.5, mx, mouthY+ns*0.5);
    cx.quadraticCurveTo(mx+ns*0.7, mouthY+ns*1.5, mx+ns*2.2, mouthY-ns*0.4);
    cx.stroke();
    cx.fillStyle = 'rgba(255,130,130,0.38)';
    cx.beginPath(); cx.ellipse(mx-eyeDX*2, eyeY+er, er*0.95, er*0.5, 0, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(mx+eyeDX*2, eyeY+er, er*0.95, er*0.5, 0, 0, Math.PI*2); cx.fill();
  } else if (mid) {
    // Wavy worried
    cx.beginPath();
    cx.moveTo(mx-ns*2, mouthY+ns*0.4);
    cx.quadraticCurveTo(mx, mouthY-ns*0.3, mx+ns*2, mouthY+ns*0.4);
    cx.stroke();
  } else {
    // Scared open-O
    cx.fillStyle='#220000';
    cx.beginPath(); cx.ellipse(mx, mouthY, ns*0.8, ns*1.1, 0, 0, Math.PI*2); cx.fill();
    cx.strokeStyle='#333'; cx.stroke();
  }
  // ── Whiskers ──
  cx.strokeStyle='rgba(80,80,80,0.75)'; cx.lineWidth=Math.max(0.5,bh*0.016);
  let wl = bw*0.44;
  for (let sign of [-1,1]) {
    for (let [yoff, yend] of [[-bh*0.04,-bh*0.05],[0,0],[bh*0.04,bh*0.03]]) {
      cx.beginPath();
      cx.moveTo(mx+sign*ns*1.2, noseY+yoff);
      cx.lineTo(mx+sign*wl, noseY+yend);
      cx.stroke();
    }
  }
  // ── HP dots (bottom of face) ──
  if (b && !b.ultra && !b.steel && b.maxHp > 1) {
    let dots = Math.min(b.maxHp, 5);
    let dotY = my + bh*0.38;
    for (let d=0; d<dots; d++) {
      let dotX = mx + (d-(dots-1)/2)*bh*0.15;
      cx.fillStyle = d < b.hp ? 'rgba(255,255,255,0.82)' : 'rgba(255,255,255,0.12)';
      cx.beginPath(); cx.arc(dotX, dotY, Math.max(1.5, bh*0.038), 0, Math.PI*2); cx.fill();
    }
  }
  // ── Tuxedo chest patch ──
  if (b && b.maxHp===2 && !b.ultra) {
    cx.fillStyle='rgba(255,255,255,0.85)';
    cx.beginPath(); cx.ellipse(mx, my+bh*0.12, bw*0.2, bh*0.2, 0, 0, Math.PI*2); cx.fill();
  }
  // ── Siamese dark face mask ──
  if (b && b.maxHp===5 && !b.ultra) {
    cx.fillStyle='rgba(80,40,20,0.28)';
    cx.beginPath(); cx.ellipse(mx, eyeY-er*0.1, er*2.5, er*1.8, 0, 0, Math.PI*2); cx.fill();
  }
}

// ── Draw a normal cat brick ────────────────────────
function drawCatBrick(b) {
  let { x:bx, y:by, w:bw, h:bh } = b;
  let fl = b.fl > 0; if(fl) b.fl--;
  let mx = bx+bw/2, my = by+bh/2;
  if (b.steel) { drawRobotCat(b, mx, my, bw, bh, fl); return; }
  if (b.ultra) { drawBossCat(b,  mx, my, bw, bh, fl); return; }

  let pal  = CP[Math.min(b.maxHp, 5)] || CP[1];
  let hpF  = b.hp / b.maxHp;
  let d    = Math.max(2, Math.min(bh*0.07, 4));
  let isPooping = poopWarnings.some(pw => pw.brId === b.id);
  cx.save();

  // ── Paper-craft 3D shadow layers ──
  cx.save(); cx.translate(d*2, d*2); cx.globalAlpha=0.28;
  pathCatBody(mx,my,bw,bh); cx.fillStyle=pal.shade2; cx.fill();
  cx.globalAlpha=1; cx.restore();
  cx.save(); cx.translate(d, d); cx.globalAlpha=0.5;
  pathCatBody(mx,my,bw,bh); cx.fillStyle=pal.shade; cx.fill();
  cx.globalAlpha=1; cx.restore();

  // ── Main body ──
  pathCatBody(mx,my,bw,bh);
  cx.fillStyle = fl ? '#ffffff' : pal.body; cx.fill();
  // Bold outline
  cx.strokeStyle = fl ? '#aaa' : pal.outline; cx.lineWidth=Math.max(1.5,bh*0.045); cx.lineJoin='round';
  pathCatBody(mx,my,bw,bh); cx.stroke();

  // ── White shine patch (top-left of body) ──
  if (!fl) {
    cx.save(); cx.globalAlpha=0.2;
    pathCatBody(mx,my,bw,bh); cx.clip();
    cx.fillStyle='#fff';
    cx.beginPath(); cx.ellipse(mx-bw*0.18, my-bh*0.2, bw*0.22, bh*0.18, -0.4, 0, Math.PI*2); cx.fill();
    cx.restore();
  }

  // ── Inner ears ──
  if (!fl) drawInnerEars(mx, my, bw, bh, fl ? '#ccc' : pal.ear);

  // ── Face ──
  if (!fl) drawCatFace(mx, my, bw, bh, pal, hpF, isPooping, b);

  // ── Poop-warning exclamation mark ──
  if (isPooping && !fl) {
    let pw = poopWarnings.find(p => p.brId === b.id);
    let blink = pw ? Math.sin(Date.now()*0.014) > 0 : false;
    if (blink) {
      cx.font=`bold ${Math.max(10,bh*0.55)}px sans-serif`;
      cx.textAlign='center'; cx.textBaseline='bottom';
      cx.fillText('💩', mx, by-2);
    }
  }
  cx.restore();
}

// ── Boss Cat (ultra HP) ───────────────────────────
function drawBossCat(b, mx, my, bw, bh, fl) {
  let hpF   = b.hp / b.maxHp;
  let hue   = Math.round(280-(1-hpF)*230);
  let glowC = `hsl(${hue},100%,60%)`;
  let pulse = 0.6 + 0.4*Math.sin(Date.now()*0.004);
  let d     = Math.max(2.5, Math.min(bh*0.08, 5));

  cx.save();
  if (!fl) { cx.shadowColor=glowC; cx.shadowBlur=10*pulse; }

  // Shadows
  cx.save(); cx.translate(d*2,d*2); cx.globalAlpha=0.3;
  pathCatBody(mx,my,bw,bh); cx.fillStyle=`hsl(${hue-20},60%,10%)`; cx.fill();
  cx.globalAlpha=1; cx.restore();
  cx.save(); cx.translate(d,d); cx.globalAlpha=0.5;
  pathCatBody(mx,my,bw,bh); cx.fillStyle=`hsl(${hue-10},70%,18%)`; cx.fill();
  cx.globalAlpha=1; cx.restore();

  // Body
  cx.shadowBlur=0;
  pathCatBody(mx,my,bw,bh);
  cx.fillStyle = fl ? '#fff' : `hsl(${hue-20},80%,14%)`; cx.fill();
  cx.strokeStyle = fl ? '#aaa' : glowC; cx.lineWidth=Math.max(2,bh*0.05); cx.lineJoin='round';
  cx.shadowColor=glowC; cx.shadowBlur=fl?0:8*pulse;
  pathCatBody(mx,my,bw,bh); cx.stroke();
  cx.shadowBlur=0;

  drawInnerEars(mx,my,bw,bh, fl?'#888':`hsl(${hue+30},100%,68%)`);
  if (!fl) {
    drawCatFace(mx,my,bw,bh,{ eye:glowC }, hpF, false, b);
    // Crown
    let crH = bh*0.24, crW = bw*0.46;
    let crY = my - bh*0.44 - crH*0.9;
    cx.fillStyle='#FFD700'; cx.strokeStyle='#B8860B'; cx.lineWidth=Math.max(1,bh*0.03); cx.lineJoin='round';
    cx.beginPath();
    cx.moveTo(mx-crW*0.5, crY+crH);
    cx.lineTo(mx-crW*0.5, crY+crH*0.5);
    cx.lineTo(mx-crW*0.22, crY+crH*0.85);
    cx.lineTo(mx,            crY);
    cx.lineTo(mx+crW*0.22, crY+crH*0.85);
    cx.lineTo(mx+crW*0.5, crY+crH*0.5);
    cx.lineTo(mx+crW*0.5, crY+crH);
    cx.closePath(); cx.fill(); cx.stroke();
    // Crown gem
    cx.fillStyle=glowC; cx.shadowColor=glowC; cx.shadowBlur=6;
    cx.beginPath(); cx.arc(mx, crY+crH*0.28, Math.max(2.5,crH*0.3), 0, Math.PI*2); cx.fill();
    cx.shadowBlur=0;
    // HP number
    let fs = Math.min(Math.round(bh*0.5), Math.round(bw*0.32));
    cx.fillStyle=glowC; cx.shadowColor=glowC; cx.shadowBlur=8;
    cx.font=`900 ${fs}px Orbitron`; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(b.hp, mx, my+bh*0.08);
    cx.shadowBlur=0;
  }
  cx.restore();
}

// ── Robot Cat (steel / indestructible) ────────────
function drawRobotCat(b, mx, my, bw, bh, fl) {
  let d = Math.max(2, bh*0.06);
  cx.save();

  cx.save(); cx.translate(d*1.5,d*1.5); cx.globalAlpha=0.32;
  pathCatBody(mx,my,bw,bh); cx.fillStyle='#111'; cx.fill();
  cx.globalAlpha=1; cx.restore();
  cx.save(); cx.translate(d*0.7,d*0.7); cx.globalAlpha=0.5;
  pathCatBody(mx,my,bw,bh); cx.fillStyle='#333'; cx.fill();
  cx.globalAlpha=1; cx.restore();

  pathCatBody(mx,my,bw,bh);
  cx.fillStyle = fl ? '#fff' : '#8899BB'; cx.fill();
  cx.strokeStyle = fl ? '#888' : '#445566'; cx.lineWidth=Math.max(1.5,bh*0.045); cx.lineJoin='round';
  pathCatBody(mx,my,bw,bh); cx.stroke();
  drawInnerEars(mx,my,bw,bh, fl?'#aaa':'#CC8899');

  if (!fl) {
    // Plate lines
    cx.strokeStyle='#5577AA88'; cx.lineWidth=Math.max(1,bh*0.028);
    cx.beginPath(); cx.moveTo(mx,b.y+bh*0.1); cx.lineTo(mx,b.y+bh*0.9); cx.stroke();
    // LED eyes
    let earH = bh*0.28, top = my-bh*0.44+earH*0.9;
    let eyeY = top+(bh*0.88-earH*0.9)*0.3;
    let er = Math.max(2.5, Math.min(bh*0.1, bw*0.08));
    cx.shadowColor='#00FF88'; cx.shadowBlur=10;
    cx.fillStyle='#00FF88';
    for (let ex of [mx-bw*0.165, mx+bw*0.165]) {
      cx.fillRect(ex-er, eyeY-er*0.65, er*2, er*1.3);
    }
    cx.shadowBlur=0;
    // Rivets
    cx.fillStyle='#AABBCC';
    for (let [rx,ry] of [[0.22,0.28],[0.78,0.28],[0.22,0.72],[0.78,0.72]]) {
      cx.beginPath(); cx.arc(b.x+bw*rx, b.y+bh*ry, Math.max(1.5,bh*0.04), 0, Math.PI*2); cx.fill();
    }
    // Antenna
    cx.strokeStyle='#99AABB'; cx.lineWidth=Math.max(1,bh*0.025);
    cx.beginPath(); cx.moveTo(mx,my-bh*0.44); cx.lineTo(mx,my-bh*0.6); cx.stroke();
    cx.fillStyle='#FF4444'; cx.shadowColor='#FF4444'; cx.shadowBlur=6;
    cx.beginPath(); cx.arc(mx, my-bh*0.62, Math.max(2,bh*0.05), 0, Math.PI*2); cx.fill();
    cx.shadowBlur=0;
  }
  cx.restore();
}

// ── Cat Food Can (ball) ────────────────────────────
function drawCanBall(b) {
  // Trail
  b.trail.forEach((t,i) => {
    let a = (i/b.trail.length)*0.42, r = b.r*(i/b.trail.length)*0.65;
    if (r<0.5) return;
    cx.beginPath(); cx.arc(t.x,t.y,r,0,Math.PI*2);
    cx.fillStyle=`rgba(255,200,80,${a.toFixed(3)})`; cx.fill();
  });

  cx.save();
  cx.translate(b.x, b.y);
  let r  = b.r;
  let cw = r * 1.55;   // half-width
  let ch = r * 1.85;   // half-height
  let rv = r * 0.28;   // rim oval height
  let rot = b.launched ? (b.x / (r*1.6)) * 0.5 : 0;
  cx.rotate(rot);

  // ── Paper-craft shadow ──
  cx.save(); cx.translate(2.5,2.5); cx.globalAlpha=0.38;
  cx.fillStyle='#7A4800';
  cx.beginPath();
  cx.moveTo(-cw, -ch+rv); cx.lineTo(-cw, ch-rv); cx.lineTo(cw, ch-rv); cx.lineTo(cw, -ch+rv);
  cx.closePath(); cx.fill();
  cx.globalAlpha=1; cx.restore();

  // ── Bottom rim ──
  cx.fillStyle='#D4A020';
  cx.beginPath(); cx.ellipse(0, ch-rv*0.5, cw, rv, 0, 0, Math.PI*2); cx.fill();

  // ── Label body ──
  let labelC = ['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#6EE7B7'][(level-1)%5];
  cx.fillStyle=labelC;
  cx.beginPath();
  cx.moveTo(-cw,-ch+rv); cx.lineTo(-cw,ch-rv);
  cx.ellipse(0,ch-rv,cw,rv*0.55,0,Math.PI,0,true);
  cx.lineTo(cw,-ch+rv);
  cx.ellipse(0,-ch+rv,cw,rv*0.55,0,0,Math.PI,true);
  cx.closePath(); cx.fill();

  // ── White label stripe ──
  cx.fillStyle='rgba(255,255,255,0.22)';
  cx.fillRect(-cw*0.75, -ch*0.18, cw*1.5, ch*0.36);

  // ── Fish icon 🐟 ──
  cx.font=`${Math.max(8,r*0.88)}px sans-serif`;
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('🐟', 0, 0);

  // ── Top rim ──
  cx.fillStyle='#FFD700'; cx.strokeStyle='#B8860B'; cx.lineWidth=Math.max(1,r*0.07);
  cx.beginPath(); cx.ellipse(0,-ch+rv,cw,rv,0,0,Math.PI*2); cx.fill(); cx.stroke();

  // ── Highlight stripe ──
  cx.fillStyle='rgba(255,255,255,0.28)';
  cx.beginPath();
  cx.moveTo(-cw*0.28,-ch+rv); cx.lineTo(-cw*0.14,ch-rv);
  cx.lineTo(cw*0.14,ch-rv); cx.lineTo(cw*0.28,-ch+rv);
  cx.closePath(); cx.fill();

  // ── Outline ──
  cx.strokeStyle='#8B5E00'; cx.lineWidth=Math.max(1.2,r*0.09); cx.lineJoin='round';
  cx.beginPath();
  cx.moveTo(-cw,-ch+rv); cx.lineTo(-cw,ch-rv); cx.lineTo(cw,ch-rv); cx.lineTo(cw,-ch+rv);
  cx.stroke();
  cx.restore();
}

// ── Person holding tray (paddle) ──────────────────
function drawPersonPaddle() {
  let { x:px, y:py, w:pw, h:ph } = paddle;
  cx.save();
  let pcx = px + pw/2;
  let trayY = py;

  // ── Tray shadow ──
  cx.fillStyle = eff.laser>0?'#880040':eff.wide>0?'#004488':eff.narrow>0?'#882200':'#C8A040';
  cx.beginPath(); cx.roundRect(px+3, trayY+3, pw, ph, ph/2); cx.fill();

  // ── Tray main ──
  let trayC = eff.laser>0?'#FF3D9A':eff.wide>0?'#00DCFF':eff.narrow>0?'#FB5607':'#FFE082';
  cx.shadowColor=trayC; cx.shadowBlur=16;
  cx.fillStyle=trayC;
  cx.beginPath(); cx.roundRect(px, trayY, pw, ph, ph/2); cx.fill();
  cx.shadowBlur=0;

  // ── Tray shine ──
  cx.fillStyle='rgba(255,255,255,0.32)';
  cx.beginPath(); cx.roundRect(px+pw*0.06, trayY, pw*0.88, ph*0.45, ph*0.4); cx.fill();

  // ── Tray outline ──
  let trayOL = eff.laser>0?'#880040':eff.wide>0?'#004488':eff.narrow>0?'#882200':'#C8A040';
  cx.strokeStyle=trayOL; cx.lineWidth=Math.max(1.5,ph*0.15); cx.lineJoin='round';
  cx.beginPath(); cx.roundRect(px, trayY, pw, ph, ph/2); cx.stroke();

  // ── Laser nozzles ──
  if (eff.laser>0) {
    let nzXs=[pcx,pcx-pw*0.27,pcx+pw*0.27];
    cx.fillStyle='#FF3D9A'; cx.shadowColor='#FF3D9A'; cx.shadowBlur=14;
    nzXs.forEach(nx=>{
      cx.fillRect(nx-2, trayY-8, 4, 9);
      cx.beginPath(); cx.arc(nx, trayY-8, 3.5, 0, Math.PI*2); cx.fill();
    });
    cx.shadowBlur=0;
  }

  // ── Person (only when paddle is tall enough) ──
  let personW = Math.min(pw*0.22, 36);
  let headR   = personW*0.44;
  let bodyH   = Math.min(ph*2.8, personW*2.2);
  let headY   = trayY + ph + bodyH + headR*0.8;

  // Arms
  cx.strokeStyle='#F5C5A3'; cx.lineWidth=Math.max(2,personW*0.17); cx.lineCap='round';
  cx.beginPath(); cx.moveTo(pcx-personW*0.4, trayY+ph+bodyH*0.08);
  cx.quadraticCurveTo(pcx-pw*0.34, trayY+ph*0.5, px+pw*0.1, trayY+ph*0.35); cx.stroke();
  cx.beginPath(); cx.moveTo(pcx+personW*0.4, trayY+ph+bodyH*0.08);
  cx.quadraticCurveTo(pcx+pw*0.34, trayY+ph*0.5, px+pw*0.9, trayY+ph*0.35); cx.stroke();

  // Body shadow
  cx.fillStyle='#4A6ACC';
  cx.beginPath(); cx.roundRect(pcx-personW*0.37+2, trayY+ph+2, personW*0.74, bodyH*0.55, personW*0.1); cx.fill();
  // Body
  cx.fillStyle='#7B9CFF';
  cx.beginPath(); cx.roundRect(pcx-personW*0.37, trayY+ph, personW*0.74, bodyH*0.55, personW*0.1); cx.fill();
  cx.strokeStyle='#3A4A9A'; cx.lineWidth=Math.max(1,personW*0.1);
  cx.beginPath(); cx.roundRect(pcx-personW*0.37, trayY+ph, personW*0.74, bodyH*0.55, personW*0.1); cx.stroke();

  // Head shadow
  cx.fillStyle='#C49060';
  cx.beginPath(); cx.arc(pcx+1.5, headY+1.5, headR, 0, Math.PI*2); cx.fill();
  // Head
  cx.fillStyle='#F5C5A3';
  cx.beginPath(); cx.arc(pcx, headY, headR, 0, Math.PI*2); cx.fill();
  cx.strokeStyle='#D49060'; cx.lineWidth=Math.max(1,headR*0.12);
  cx.beginPath(); cx.arc(pcx, headY, headR, 0, Math.PI*2); cx.stroke();

  // Cat ears on person's head (they love cats!)
  cx.fillStyle='#FF88AA';
  for (let sign of [-1,1]) {
    cx.beginPath();
    cx.moveTo(pcx+sign*headR*0.65, headY-headR*0.45);
    cx.lineTo(pcx+sign*headR*0.92, headY-headR*1.3);
    cx.lineTo(pcx+sign*headR*0.3, headY-headR*0.72);
    cx.closePath(); cx.fill();
    cx.strokeStyle='#CC4488'; cx.lineWidth=Math.max(0.8,headR*0.1);
    cx.beginPath();
    cx.moveTo(pcx+sign*headR*0.65, headY-headR*0.45);
    cx.lineTo(pcx+sign*headR*0.92, headY-headR*1.3);
    cx.lineTo(pcx+sign*headR*0.3, headY-headR*0.72);
    cx.stroke();
  }

  // Face
  let eyeY2=headY-headR*0.1, er2=headR*0.18;
  cx.fillStyle='#222';
  for (let ex of [pcx-headR*0.32,pcx+headR*0.32]) {
    cx.beginPath(); cx.arc(ex, eyeY2, er2, 0, Math.PI*2); cx.fill();
  }
  cx.fillStyle='#fff';
  for (let ex of [pcx-headR*0.32,pcx+headR*0.32]) {
    cx.beginPath(); cx.arc(ex+er2*0.38, eyeY2-er2*0.32, er2*0.34, 0, Math.PI*2); cx.fill();
  }
  // Happy smile
  cx.strokeStyle='#884422'; cx.lineWidth=Math.max(0.8,headR*0.1); cx.lineCap='round';
  cx.beginPath(); cx.arc(pcx, headY+headR*0.22, headR*0.26, 0.1, Math.PI-0.1); cx.stroke();
  cx.restore();
}

// ── Falling Poop ──────────────────────────────────
function drawPoopObj(p) {
  cx.save();
  cx.translate(p.x, p.y);
  let r = p.r;
  let layers = [
    [r*0.88, r*0.44,  r*0.08,  '#5D4037'],
    [r*0.70, r*0.40, -r*0.38,  '#6D4C41'],
    [r*0.50, r*0.34, -r*0.73,  '#795548'],
    [r*0.30, r*0.25, -r*1.02,  '#8D6E63'],
  ];

  // Shadow
  cx.save(); cx.translate(2.5,2.5); cx.globalAlpha=0.32;
  layers.forEach(([rw,rh,yoff]) => {
    cx.fillStyle='#2A1005';
    cx.beginPath(); cx.ellipse(0,yoff,rw,rh,0,0,Math.PI*2); cx.fill();
  });
  cx.globalAlpha=1; cx.restore();

  // Layers
  layers.forEach(([rw,rh,yoff,c]) => {
    cx.fillStyle=c;
    cx.beginPath(); cx.ellipse(0,yoff,rw,rh,0,0,Math.PI*2); cx.fill();
    // Highlight
    cx.fillStyle='rgba(255,200,150,0.14)';
    cx.beginPath(); cx.ellipse(-rw*0.25,yoff-rh*0.24,rw*0.28,rh*0.2,-0.3,0,Math.PI*2); cx.fill();
  });

  // Outlines
  cx.strokeStyle='#3E1A05'; cx.lineWidth=Math.max(1,r*0.06);
  layers.forEach(([rw,rh,yoff]) => {
    cx.beginPath(); cx.ellipse(0,yoff,rw,rh,0,0,Math.PI*2); cx.stroke();
  });

  // Cute face on poop
  let fy = layers[1][2];
  let er = r*0.13;
  cx.fillStyle='#100808';
  for (let ex of [-r*0.24,r*0.24]) { cx.beginPath(); cx.arc(ex,fy,er,0,Math.PI*2); cx.fill(); }
  cx.fillStyle='rgba(255,255,255,0.88)';
  for (let ex of [-r*0.24,r*0.24]) { cx.beginPath(); cx.arc(ex+er*0.38,fy-er*0.28,er*0.33,0,Math.PI*2); cx.fill(); }
  cx.strokeStyle='#200A0A'; cx.lineWidth=Math.max(0.8,r*0.04); cx.lineCap='round';
  cx.beginPath(); cx.arc(0,fy+er*0.6,r*0.19,0.1,Math.PI-0.1); cx.stroke();

  // Steam wisps
  cx.strokeStyle='rgba(180,160,130,0.45)'; cx.lineWidth=Math.max(1,r*0.06);
  for (let [sx,sy] of [[-r*0.36, layers[3][2]-r*0.1],[0,layers[3][2]-r*0.18],[r*0.36,layers[3][2]-r*0.1]]) {
    cx.beginPath(); cx.moveTo(sx,sy);
    cx.quadraticCurveTo(sx-r*0.1,sy-r*0.38,sx+r*0.09,sy-r*0.58); cx.stroke();
  }
  cx.restore();
}

// ═══════════════════════════════════════════════════
//  RENDER  — Cat Feast Edition
// ═══════════════════════════════════════════════════
function render() {
  cx.clearRect(0, 0, W, H);

  // Background grid (subtle)
  cx.strokeStyle = 'rgba(0,170,255,0.028)'; cx.lineWidth = 1;
  let gs = Math.round(H/16);
  for (let x=0; x<W; x+=gs) { cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y=0; y<H; y+=gs) { cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }

  // ── Cats (bricks) ──
  let now = Date.now();
  for (let b of bricks) drawCatBrick(b);

  // ── Particles ──
  for (let p of ptcls) {
    cx.save(); cx.globalAlpha = Math.max(0, p.life);
    if (p.shard) {
      cx.translate(p.x,p.y); cx.rotate(p.ang);
      cx.fillStyle=p.c; cx.shadowColor=p.c; cx.shadowBlur=4;
      cx.fillRect(-p.w/2,-p.ht/2,p.w,p.ht);
    } else {
      cx.beginPath(); cx.arc(p.x,p.y,Math.max(0.5,p.r),0,Math.PI*2);
      cx.fillStyle=p.c;
      if(p.glow){cx.shadowColor=p.c;cx.shadowBlur=p.r*3.5;}
      cx.fill();
    }
    cx.restore();
  }

  // ── Falling power-up gems ──
  for (let p of drops) {
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.shadowColor=p.def.c; cx.shadowBlur=16;
    cx.beginPath();
    for (let i=0;i<12;i++) {
      let a=i*Math.PI/6, ri=i%2===0?p.r:p.r*0.48;
      let x2=ri*Math.sin(a), y2=-ri*Math.cos(a);
      i===0?cx.moveTo(x2,y2):cx.lineTo(x2,y2);
    }
    cx.closePath(); cx.fillStyle=p.def.bg; cx.strokeStyle=p.def.c; cx.lineWidth=2;
    cx.fill(); cx.stroke();
    cx.shadowBlur=0; cx.fillStyle='#fff';
    cx.font=`bold ${Math.round(p.r*0.88)}px Rajdhani`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(p.def.lbl, 0, 0);
    cx.restore();
  }

  // ── Falling poop ──
  for (let p of poops) drawPoopObj(p);

  // ── Lasers ──
  for (let la of lasers) {
    cx.save(); cx.shadowColor='#ff3d9a'; cx.shadowBlur=22;
    let lg=cx.createLinearGradient(la.x,la.y,la.x,la.y-32);
    lg.addColorStop(0,'rgba(255,61,154,0.95)'); lg.addColorStop(1,'rgba(255,61,154,0)');
    cx.fillStyle=lg; cx.fillRect(la.x-la.w/2,la.y-34,la.w,36);
    cx.restore();
  }

  // ── Cat food cans (balls) ──
  for (let b of balls) drawCanBall(b);

  // ── Person+tray (paddle) ──
  drawPersonPaddle();

  // ── Launch hint ──
  if (gst==='playing' && balls.length>0 && !balls[0].launched) {
    cx.save();
    cx.font=`${Math.max(9,H*0.016)}px Rajdhani`;
    cx.fillStyle = aiMode ? 'rgba(168,85,247,0.55)' : 'rgba(255,200,80,0.6)';
    cx.textAlign='center'; cx.textBaseline='bottom';
    cx.fillText(aiMode ? '🤖 AI 自動發射中…' : '🐟 丟出罐頭！TAP / SPACE',
                W/2, paddle.y-balls[0].r-8);
    cx.restore();
  }

  // ── AI Visualization ──
  if (aiMode && gst==='playing') {
    cx.save();

    // ── Highlight the cat the AI is currently aiming at ──
    if (_aiTargetBrick) {
      let tb2 = _aiTargetBrick;
      let pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.008);
      // Pulsing red/orange glow ring around target brick
      cx.strokeStyle = `rgba(255,80,0,${0.5 + 0.4*pulse})`;
      cx.lineWidth   = 3;
      cx.shadowColor = '#ff5000';
      cx.shadowBlur  = 14 + 8*pulse;
      cx.setLineDash([5,4]);
      cx.beginPath();
      cx.rect(tb2.x-3, tb2.y-3, tb2.w+6, tb2.h+6);
      cx.stroke();
      cx.setLineDash([]);
      cx.shadowBlur = 0;
      // Arrow line from paddle to target brick
      cx.beginPath();
      cx.moveTo(paddle.x + paddle.w/2, paddle.y);
      cx.lineTo(tb2.x + tb2.w/2, tb2.y + tb2.h);
      cx.strokeStyle = `rgba(255,120,0,${0.25 + 0.15*pulse})`;
      cx.lineWidth   = 1.5;
      cx.setLineDash([4,8]);
      cx.stroke();
      cx.setLineDash([]);
      // "🎯" label above target
      cx.font = `${Math.max(10, tb2.h*0.75)}px sans-serif`;
      cx.textAlign    = 'center';
      cx.textBaseline = 'bottom';
      cx.fillText('🎯', tb2.x + tb2.w/2, tb2.y - 2);
    }

    if (_aiChasing) {
      let drop = _aiChasing;
      // Gold dash to targeted drop
      cx.beginPath(); cx.moveTo(paddle.x+paddle.w/2, paddle.y);
      cx.lineTo(drop.x, drop.y);
      cx.strokeStyle='rgba(255,214,10,0.45)'; cx.lineWidth=2;
      cx.setLineDash([5,7]); cx.stroke(); cx.setLineDash([]);
      // Ring around drop
      cx.beginPath(); cx.arc(drop.x, drop.y, drop.r+7, 0, Math.PI*2);
      cx.strokeStyle='rgba(255,214,10,0.7)'; cx.lineWidth=2;
      cx.shadowColor='#ffd60a'; cx.shadowBlur=14; cx.stroke();
      cx.shadowBlur=0;
      cx.font=`bold ${Math.max(9,H*0.014)}px Orbitron`;
      cx.fillStyle='#ffd60a'; cx.textAlign='center'; cx.textBaseline='bottom';
      cx.fillText(`⬆ ${drop.def.name}`, paddle.x+paddle.w/2, paddle.y-6);
    } else if (_aiPredX!==null && _aiTrackedBall!==null) {
      let tb=_aiTrackedBall;
      cx.beginPath(); cx.moveTo(tb.x,tb.y); cx.lineTo(_aiPredX,paddle.y);
      cx.strokeStyle='rgba(168,85,247,0.3)'; cx.lineWidth=1.5;
      cx.setLineDash([5,8]); cx.stroke(); cx.setLineDash([]);
      cx.beginPath(); cx.arc(_aiPredX,paddle.y+paddle.h*0.5,5,0,Math.PI*2);
      cx.fillStyle='rgba(168,85,247,0.75)'; cx.shadowColor='#a855f7'; cx.shadowBlur=12; cx.fill();
      cx.beginPath(); cx.arc(tb.x,tb.y,tb.r+4,0,Math.PI*2);
      cx.strokeStyle='rgba(168,85,247,0.52)'; cx.lineWidth=1.5; cx.shadowBlur=8; cx.stroke();
      cx.shadowBlur=0;
      cx.font=`bold ${Math.max(9,H*0.014)}px Orbitron`;
      cx.fillStyle=_aiTargetBrick?'#ff8000':'rgba(168,85,247,0.78)';
      cx.textAlign='center'; cx.textBaseline='bottom';
      cx.fillText(_aiTargetBrick?'🎯 瞄準中':'🤖 AI', paddle.x+paddle.w/2, paddle.y-6);
    }
    // Scan sweep
    let scanY=(Math.sin(now*0.0006)*0.5+0.5)*H*0.52;
    cx.beginPath(); cx.moveTo(0,scanY); cx.lineTo(W,scanY);
    let sg2=cx.createLinearGradient(0,0,W,0);
    sg2.addColorStop(0,'rgba(168,85,247,0)');
    sg2.addColorStop(0.5,_aiChasing?'rgba(255,214,10,0.08)':'rgba(168,85,247,0.08)');
    sg2.addColorStop(1,'rgba(168,85,247,0)');
    cx.strokeStyle=sg2; cx.shadowBlur=0; cx.lineWidth=6; cx.stroke();
    cx.restore();
  }
}

// ═══════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════
function loop(ts) {
  rafID = requestAnimationFrame(loop);
  if (lastTS === null) { lastTS = ts; return; }
  let dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  if (gst === 'playing') update(dt);
  if (gst !== 'start')   render();
}

// ═══════════════════════════════════════════════════
//  RESIZE HANDLER
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => {
  if (gst === 'playing') {
    let oldW = W, oldH = H;
    let oldRatio = oldW / Math.max(oldH, 1);
    resize();
    let newRatio = W / Math.max(H, 1);

    // Scale entity positions
    if (oldW > 0) paddle.x = (paddle.x / oldW) * W;
    paddle.y = H - paddle.h - Math.max(8, H * 0.048);
    if (oldW > 0 && oldH > 0) {
      balls.forEach(b => { b.x = (b.x/oldW)*W; b.y = (b.y/oldH)*H; });
      drops.forEach(p => { p.x = (p.x/oldW)*W; p.y = (p.y/oldH)*H; });
    }

    // If orientation flipped (portrait↔landscape), rebuild bricks with new
    // canvas dimensions while preserving remaining HP so progress is kept.
    if (Math.abs(newRatio - oldRatio) > 0.5) {
      let hpMap = {};
      bricks.forEach(b => { hpMap[b.id] = { hp: b.hp, ultra: b.ultra }; });
      buildBricks();
      bricks.forEach(b => {
        if (hpMap[b.id] !== undefined) {
          b.hp    = hpMap[b.id].hp;
          b.ultra = hpMap[b.id].ultra;
        }
      });
      // Keep only bricks that were still alive before the resize
      bricks = bricks.filter(b => hpMap[b.id] !== undefined);
    }
  } else {
    resize();
  }
  initStars();
});

// ═══════════════════════════════════════════════════
//  BOOTSTRAP
// ═══════════════════════════════════════════════════
resize();
refreshHUD();
rafID = requestAnimationFrame(loop);

// Expose the AI toggle to HTML onclick attribute
window.toggleAI = toggleAI;

})();
</script>
</body>
</html>
