<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>貓咪吃罐罐</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100dvh;overflow:hidden;background:#020415;user-select:none}
body{font-family:'Orbitron',monospace;display:flex;flex-direction:column;align-items:center}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

#wrap{
  position:relative;z-index:1;
  width:100%;max-width:700px;height:100dvh;
  display:flex;flex-direction:column;
}

/* ── HUD ── */
#hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 14px;flex-shrink:0;
  background:rgba(1,3,20,0.93);
  border-bottom:1px solid rgba(0,210,255,0.15);
}
.hb{display:flex;flex-direction:column;align-items:center;min-width:56px}
.hl{font-size:8px;letter-spacing:2px;color:rgba(0,210,255,0.5);font-family:'Rajdhani',sans-serif;text-transform:uppercase}
.hv{font-size:clamp(13px,2.8vw,19px);font-weight:900;letter-spacing:1px;line-height:1.15}
.cy{color:#00dcff;text-shadow:0 0 8px #00dcff88}
.pk{color:#ff3d9a;text-shadow:0 0 8px #ff3d9a88}
.gd{color:#ffd60a;text-shadow:0 0 8px #ffd60a88}
.wh{color:#fff}
.lives{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap;max-width:80px}
.ld{width:10px;height:10px;border-radius:50%;background:#ff3d9a;box-shadow:0 0 6px #ff3d9a;transition:all .3s}
.ld.off{background:#111628;box-shadow:none}
.ld.gold{background:#ffd60a!important;box-shadow:0 0 6px #ffd60a!important}

/* ── GAME AREA ── */
#area{flex:1;position:relative;overflow:hidden}

/* Scanline overlay */
#area::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.03) 0px,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 3px);
}

#gc{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none;z-index:1}

/* ── POWER-UP BAR ── */
#pub{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;pointer-events:none;z-index:5;
}
@media(pointer:coarse){#pub{bottom:68px}}
.pib{
  padding:2px 9px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:1px;
  font-family:'Rajdhani',sans-serif;white-space:nowrap;
  animation:piblink 0.9s infinite alternate;
}
@keyframes piblink{to{opacity:.5}}

/* ── OVERLAYS ── */
.ovl{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(2,4,21,0.9);backdrop-filter:blur(6px);
  z-index:20;
}
.ttl{
  font-size:clamp(28px,7vw,60px);font-weight:900;letter-spacing:5px;
  text-align:center;line-height:1.1;margin-bottom:10px;
  background:linear-gradient(135deg,#00dcff 0%,#ff3d9a 55%,#ffd60a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.ttl.danger{background:linear-gradient(135deg,#ff3d9a,#660020);-webkit-background-clip:text}
.sub{
  font-size:clamp(9px,2vw,12px);color:#8888bb;letter-spacing:4px;
  font-family:'Rajdhani';text-transform:uppercase;margin-bottom:24px;text-align:center;
}
.nbtn{
  padding:12px 34px;font-family:'Orbitron',monospace;
  font-size:clamp(10px,2vw,13px);font-weight:700;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;background:rgba(0,220,255,0.1);color:#00dcff;
  border:2px solid rgba(0,220,255,0.65);border-radius:3px;margin:4px;
  box-shadow:0 0 14px rgba(0,220,255,0.22);transition:all .18s;
}
.nbtn:hover,.nbtn:active{background:rgba(0,220,255,0.2);box-shadow:0 0 24px rgba(0,220,255,0.5);transform:scale(1.03)}
.nbtn.r{border-color:rgba(255,61,154,0.65);color:#ff3d9a;background:rgba(255,61,154,0.1);box-shadow:0 0 14px rgba(255,61,154,0.22)}
.nbtn.r:hover,.nbtn.r:active{background:rgba(255,61,154,0.2);box-shadow:0 0 24px rgba(255,61,154,0.5)}
.srow{display:flex;gap:clamp(14px,4vw,36px);margin:16px 0}
.si{text-align:center}
.sn{font-size:clamp(20px,5vw,36px);font-weight:900;color:#00dcff;text-shadow:0 0 10px #00dcff66}
.sl2{font-size:8px;color:#8888bb;letter-spacing:2px;font-family:'Rajdhani';text-transform:uppercase;margin-top:3px}
.lvlnum{
  font-size:clamp(58px,13vw,96px);font-weight:900;color:#ffd60a;
  text-shadow:0 0 22px #ffd60a,0 0 55px rgba(255,214,10,0.25);line-height:1;
}
.lvltx{font-size:9px;letter-spacing:5px;color:#8888bb;font-family:'Rajdhani';text-transform:uppercase;margin-bottom:5px}
.lvldc{font-size:11px;letter-spacing:2px;color:#aaa;font-family:'Rajdhani';margin:14px 0;text-transform:uppercase}

/* ── COMBO POPUP ── */
#cpop{
  position:absolute;top:16%;left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:15;
  font-family:'Orbitron',monospace;font-weight:900;text-align:center;
  opacity:0;transition:opacity .25s;text-shadow:0 0 22px currentColor;
}

/* ── HINT ── */
#hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:9px;color:rgba(255,255,255,0.18);letter-spacing:2px;
  font-family:'Rajdhani';white-space:nowrap;pointer-events:none;z-index:4;
}
@media(pointer:coarse){#hint{display:none}}

/* ── MOBILE BUTTONS ── */
#mob{
  display:none;position:absolute;bottom:6px;left:0;right:0;
  justify-content:space-between;padding:0 16px;z-index:10;pointer-events:none;
}
.mb{
  width:54px;height:54px;border-radius:50%;pointer-events:all;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:rgba(0,220,255,0.1);border:2px solid rgba(0,220,255,0.38);
  color:rgba(0,220,255,0.85);box-shadow:0 0 8px rgba(0,220,255,0.12);
  transition:background .1s;-webkit-tap-highlight-color:transparent;cursor:pointer;
}
.mb:active{background:rgba(0,220,255,0.28)}
.mb.f{background:rgba(255,61,154,0.1);border-color:rgba(255,61,154,0.38);color:rgba(255,61,154,0.85);box-shadow:0 0 8px rgba(255,61,154,0.12)}
.mb.f:active{background:rgba(255,61,154,0.28)}
@media(pointer:coarse){#mob{display:flex}}

@media (orientation:landscape) and (max-height:360px){
  .ovl{padding:6px}
  .ttl{font-size:clamp(18px,7vh,25px);letter-spacing:2px;margin-bottom:4px}
  .sub{font-size:9px;letter-spacing:2px;margin-bottom:8px}
  .nbtn{padding:6px 18px;font-size:10px;margin:2px}
  .srow{gap:18px;margin:8px 0}
  .sn{font-size:20px}
  .sl2{font-size:7px}
  .lvlnum{font-size:clamp(40px,18vh,64px)}
  .lvldc{font-size:9px;margin:6px 0}
  #ss>div:last-child{margin-top:8px!important;font-size:8px!important;line-height:1.8!important}
}

/* ── Hide buttons when AI is in control ── */
#mob.ai-hidden { display:none !important; }

/* ══════════════════════════════════════════
   LANDSCAPE MOBILE  (e.g. phone rotated)
   Layout becomes: [sidebar HUD | game area]
   so the full screen height is used for play.
══════════════════════════════════════════ */
@media (orientation:landscape) and (max-height:520px) {
  /* Wrap switches to row: HUD left, game right */
  #wrap { flex-direction:row; max-width:100%; }

  /* HUD → vertical sidebar */
  #hud {
    flex-direction:column;
    width:78px; min-width:78px;
    height:100dvh;
    border-right:1px solid rgba(0,210,255,0.15);
    border-bottom:none;
    padding:5px 3px;
    justify-content:space-evenly;
    align-items:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .hb    { min-width:0; width:100%; text-align:center; }
  .hl    { font-size:6px; letter-spacing:1px; }
  .hv    { font-size:clamp(9px,1.9vh,13px); letter-spacing:0; }
  .ld    { width:7px; height:7px; }
  .lives { gap:3px; flex-wrap:wrap; max-width:54px; justify-content:center; }

  /* Game area fills remaining space at full height */
  #area  { flex:1; height:100dvh; }

  /* Power-up bar: shift up a bit */
  #pub       { bottom:4px; }
  #pub .pib  { font-size:9px; padding:1px 6px; }

  /* Combo pop + hint adjustments */
  #cpop  { top:10%; font-size:18px!important; }
  #hint  { font-size:8px; bottom:3px; }

  /* AI button: smaller in landscape */
  #ai-btn { top:5px; right:6px; font-size:7px; padding:3px 9px; }
  #ai-bar { font-size:7px; letter-spacing:2px; padding:2px 0; }

  /* No on-screen d-pad in landscape — canvas touch controls the paddle */
  #mob { display:none !important; }
}

/* ── AI Button ── */
#ai-btn{
  position:absolute;top:8px;right:10px;z-index:25;
  padding:5px 14px;font-family:'Orbitron',monospace;
  font-size:9px;font-weight:700;letter-spacing:1px;
  cursor:pointer;border-radius:20px;transition:all .22s;
  border:2px solid rgba(0,220,255,0.32);
  background:rgba(1,3,20,0.85);color:rgba(0,220,255,0.6);
  white-space:nowrap;
}
#ai-btn.on{
  border-color:#a855f7;color:#d4aaff;
  background:rgba(168,85,247,0.18);
  box-shadow:0 0 16px rgba(168,85,247,0.5);
  animation:aipulse 2s ease-in-out infinite alternate;
}
@keyframes aipulse{to{box-shadow:0 0 28px rgba(168,85,247,0.8)}}

/* AI mode status bar */
#ai-bar{
  position:absolute;top:0;left:0;right:0;
  display:none;align-items:center;justify-content:center;
  padding:3px 0;z-index:6;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,0.18),transparent);
  border-bottom:1px solid rgba(168,85,247,0.3);
  font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:3px;
  color:rgba(168,85,247,0.8);text-transform:uppercase;
}
#ai-bar.show{display:flex}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="wrap">
  <div id="hud">
    <div class="hb"><div class="hl">分數</div><div class="hv cy" id="hs">0</div></div>
    <div class="hb"><div class="hl">生命</div><div class="lives" id="hlv"></div></div>
    <div class="hb"><div class="hl">關卡</div><div class="hv gd" id="hlvl">1</div></div>
    <div class="hb"><div class="hl">時間</div><div class="hv pk" id="ht">00:00</div></div>
    <div class="hb"><div class="hl">連擊</div><div class="hv wh" id="hc">×1</div></div>
  </div>

  <div id="area">
    <canvas id="gc"></canvas>
    <div id="pub"></div>
    <div id="cpop"></div>
    <div id="hint">← → 移動 &nbsp;·&nbsp; 空白鍵 發射 / 雷射</div>

    <!-- START -->
    <div class="ovl" id="ss">
      <div class="ttl">貓咪吃<br>罐罐</div>
      <div class="sub">霓虹打磚塊 · 終極版</div>
      <button class="nbtn" id="b-start">▶ 開始遊戲</button>
      <div style="margin-top:20px;font-size:9px;color:#2a2a55;font-family:'Rajdhani';letter-spacing:2px;text-align:center;line-height:2.4">
        滑鼠 / 觸控 移動板子 &nbsp;·&nbsp; 空白鍵 或點擊 發射<br>
        接住道具 · 累積連擊 · 雷射炮擊 · 無限關卡
      </div>
    </div>

    <!-- LEVEL TRANSITION -->
    <div class="ovl" id="sl" style="display:none">
      <div class="lvltx">關卡</div>
      <div class="lvlnum" id="lnum">1</div>
      <div class="lvldc" id="ldesc">準備好了嗎？</div>
      <button class="nbtn" id="b-go">出發 !</button>
    </div>

    <!-- GAME OVER -->
    <div class="ovl" id="so" style="display:none">
      <div class="ttl danger">遊戲<br>結束</div>
      <div class="srow">
        <div class="si"><div class="sn" id="go-s">0</div><div class="sl2">分數</div></div>
        <div class="si"><div class="sn" id="go-l">1</div><div class="sl2">關卡</div></div>
        <div class="si"><div class="sn" id="go-t">00:00</div><div class="sl2">時間</div></div>
      </div>
      <button class="nbtn r" id="b-retry">再玩一次</button>
    </div>

    <!-- WIN -->
    <div class="ovl" id="sw" style="display:none">
      <div class="ttl">關卡<br>完成!</div>
      <div class="srow">
        <div class="si"><div class="sn" id="wn-s">0</div><div class="sl2">分數</div></div>
        <div class="si"><div class="sn" id="wn-t">00:00</div><div class="sl2">時間</div></div>
      </div>
      <button class="nbtn" id="b-next">下一關 ▶</button>
    </div>

    <!-- AI STATUS BAR -->
    <div id="ai-bar">🤖 &nbsp; AI 自動遊玩 &nbsp; 🤖</div>

    <!-- AI TOGGLE BUTTON -->
    <button id="ai-btn" onclick="toggleAI()">👤 手動</button>

    <!-- MOBILE BUTTONS -->
    <div id="mob">
      <button class="mb" id="btn-l">◀</button>
      <button class="mb f" id="btn-f">⚡</button>
      <button class="mb" id="btn-r">▶</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';
// ═══════════════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════════════
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}
function resumeAC() { try { if (getAC().state === 'suspended') getAC().resume(); } catch(e){} }

function tone(freq, type, vol, dur, endFreq) {
  try {
    resumeAC();
    let a = getAC();
    let o = a.createOscillator();
    let g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = type;
    o.frequency.setValueAtTime(Math.max(0.1, freq), a.currentTime);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(0.1, endFreq), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.start(); o.stop(a.currentTime + dur);
  } catch(e) {}
}

function noise(dur, vol, bandFreq) {
  try {
    resumeAC();
    let a = getAC();
    let buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    let d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    let src = a.createBufferSource();
    let flt = a.createBiquadFilter();
    let g = a.createGain();
    src.buffer = buf;
    flt.type = 'bandpass';
    flt.frequency.value = bandFreq || 500;
    flt.Q.value = 1.5;
    src.connect(flt); flt.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    src.start(); src.stop(a.currentTime + dur);
  } catch(e) {}
}

let SFX = {
  hit:    () => { tone(240 + Math.random()*180, 'square', 0.13, 0.07, 100); },
  brk:    () => { tone(480, 'sawtooth', 0.18, 0.1, 65); noise(0.1, 0.1, 900); },
  hard:   () => { tone(155, 'square', 0.14, 0.06); noise(0.04, 0.07, 280); },
  pad:    () => { tone(430, 'sine', 0.17, 0.12, 640); },
  wall:   () => { tone(185, 'triangle', 0.07, 0.04); },
  pu:     () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f,'sine',0.2,0.13), i*65)); },
  laser:  () => { tone(1600, 'sawtooth', 0.14, 0.07, 240); },
  die:    () => { tone(135, 'sawtooth', 0.2, 0.4, 42); noise(0.3, 0.1, 180); },
  clear:  () => { [784,988,1175,1396,1568].forEach((f,i) => setTimeout(() => tone(f,'sine',0.22,0.22), i*90)); },
  combo:  (n) => { tone(440 * (1 + n * 0.07), 'sine', 0.14, 0.1); },
};

// ═══════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════
let bgEl  = document.getElementById('bg');
let bgCtx = bgEl.getContext('2d');
let stars = [];

function initStars() {
  bgEl.width  = window.innerWidth;
  bgEl.height = window.innerHeight;
  stars = Array.from({length: 170}, () => ({
    x:  Math.random() * bgEl.width,
    y:  Math.random() * bgEl.height,
    r:  Math.random() * 1.4 + 0.2,
    sp: Math.random() * 0.22 + 0.04,
    a:  Math.random() * 0.8 + 0.15,
    c:  ['#00dcff','#ff3d9a','#ffffff','#ffd60a','#a855f7'][Math.floor(Math.random()*5)]
  }));
}

function drawStars() {
  let W2 = bgEl.width, H2 = bgEl.height;
  bgCtx.fillStyle = '#020415';
  bgCtx.fillRect(0, 0, W2, H2);

  // Nebula glows
  let nebulas = [
    [0.25, 0.35, 'rgba(0,28,90,0.17)'],
    [0.72, 0.60, 'rgba(48,0,72,0.13)'],
    [0.50, 0.10, 'rgba(0,18,60,0.09)'],
  ];
  nebulas.forEach(([rx, ry, c]) => {
    let g = bgCtx.createRadialGradient(W2*rx, H2*ry, 0, W2*rx, H2*ry, W2*0.44);
    g.addColorStop(0, c);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W2, H2);
  });

  // Stars
  stars.forEach(s => {
    s.y += s.sp;
    if (s.y > H2) { s.y = 0; s.x = Math.random() * W2; }
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = s.c + Math.floor(s.a * 255).toString(16).padStart(2, '0');
    bgCtx.fill();
  });
  requestAnimationFrame(drawStars);
}

initStars();
drawStars();
window.addEventListener('resize', initStars);

// ═══════════════════════════════════════════════════
//  GAME CORE
// ═══════════════════════════════════════════════════
let gc   = document.getElementById('gc');
let cx   = gc.getContext('2d');
let area = document.getElementById('area');

// Canvas dimensions (updated on resize)
let W = 480, H = 720;

// ── Game state ──
let gst = 'start';   // start | playing | over | win
let score  = 0;
let lives  = 3;
let level  = 1;
let combo  = 1;
let totalSecs = 0;
let timerID   = null;
let rafID     = null;
let lastTS    = null;
let lastHitMs = 0;    // timestamp of last brick hit (for combo timeout)

// ── Entity arrays ──
let paddle = {};
let balls  = [];
let bricks = [];
let ptcls  = [];   // particles
let drops  = [];   // falling power-up gems
let lasers = [];

// ── Active effects ──
let eff = { laser: 0, wide: 0, narrow: 0, shield: 0 };  // seconds remaining

// ── Input ──
let mouseX = null, touchX = null;
let keyL = false, keyR = false;

// ── AI ──
let aiMode        = false;
let aiLaserTimer  = 0;      // countdown before next auto-laser
let _aiPredX      = null;   // cached ball landing prediction (for drawing)
let _aiTrackedBall= null;   // which ball the AI is tracking (for drawing)
let _aiChasing    = null;   // def.id of power-up being chased, null = tracking ball
let _aiTargetBrick= null;   // target brick AI is aiming toward

// ── Layout constants ──
let PW_BASE  = 0.155;   // paddle width / W
let PH_BASE  = 0.022;   // paddle height / H
let BR_RATIO = 0.0175;  // ball radius / H
let SPD_BASE = 0.52;    // ball speed (px/s) / H base
let PU_DUR   = 10;      // power-up duration (seconds)

// ═══════════════════════════════════════════════════
//  COLORS
// ═══════════════════════════════════════════════════
// Particle / shard glow colours per HP (used in hitBrick & spawnShards)
let BGLO = {
  1: '#00e5ff', 2: '#b04fff', 3: '#ff4499', 4: '#ffd60a', 5: '#00e676',
};
// Cat glow colour lookup (matches CP palette body colours)
let BCLR = {
  1: ['#00e5ff','#0080cc'],
  2: ['#b04fff','#6600bb'],
  3: ['#ff4499','#aa0040'],
  4: ['#ffd60a','#cc9500'],
  5: ['#00e676','#007744'],
};
let STEEL_CLR  = ['#9da5b4','#5a6070'];
let STEEL_GLOW = '#7080a0';

// ═══════════════════════════════════════════════════
//  POOP SYSTEM
// ═══════════════════════════════════════════════════
let poops        = [];  // { x, y, r, vy }
let poopWarnings = [];  // { brId, x, y, timer }
let POOP_WARN_DUR = 2.0;    // seconds warning before poop drops (longer = fairer)
let POOP_MAX_BASE = 1;       // max simultaneous poops at level 1

// Poop rate and cap scale with level — very rare early, gradually increasing
function getPoopRate()  { return Math.min(0.00008 + level * 0.000055, 0.0012); }
function getPoopMax()   { return Math.min(POOP_MAX_BASE + Math.floor(level / 3), 5); }
let POOP_SPD_R    = 0.26;   // poop fall speed ratio of H

// 預測「未來 tSec 秒後」球會落在板子的哪個 X（含牆壁、天花板、板面反彈）。
// 用於貓大便避讓：貓大便警告→落下→掉到板子需要時間，必須用「貓大便實際落到
// 板子的那個未來時刻」的擊球點來判斷哪裡危險，而不是用現在的擊球點——否則球
// 早已移走，避讓完全無效（實測：用當下擊球點避讓對勝率零幫助）。
// 回傳 null 代表目前沒有已發射的球。
function predictBallXAt(tSec) {
  let b = null;
  for (let x of balls) { if (x.launched) { b = x; break; } }
  if (!b) return null;
  let px = b.x, pvx = b.vx, py = b.y, pvy = b.vy;
  let minX = b.r, maxX = W - b.r, DT = 1 / 120;
  let steps = Math.max(1, Math.round(tSec / DT));
  for (let s = 0; s < steps; s++) {
    px += pvx * DT; py += pvy * DT;
    if (px < minX) { px = minX; pvx = Math.abs(pvx); }
    if (px > maxX) { px = maxX; pvx = -Math.abs(pvx); }
    if (py < b.r) { py = b.r; pvy = Math.abs(pvy); }            // 天花板
    if (py >= paddle.y) { py = paddle.y; pvy = -Math.abs(pvy); } // 板面反彈
  }
  return px;
}

// ─── Poop update (call inside update()) ───
function updatePoops(dt) {
  // Generate warnings from alive non-steel cats
  if (poops.length + poopWarnings.length < getPoopMax()) {
    // ── 貓大便落點避讓演算法（未來擊球點版）──
    // 對每個候選貓磚，算出它的大便從「現在」到「落到板子」的總時間
    // （警告 0.9 秒 + 從磚落到板子的時間），再預測球在那個未來時刻會落在哪，
    // 用那個「未來擊球點」判斷此貓磚落點是否危險（在擊球點 ±1.2 板寬內）。
    // 為涵蓋預測誤差，對落下時刻前後各取樣一次，任一命中都算危險。
    // 優先從「安全」貓磚掉落大便，只有完全沒有安全貓磚時才退回危險組——
    // 保留隨機性與適度挑戰，同時大幅減少「貓大便落點 = 擊球點」的必死情況。
    // 人類與 AI 都受惠。（實測：此版把 AI 全破率從 ~16% 提升到 ~31%。）
    let poopV = H * POOP_SPD_R;
    let dangerR = paddle.w * 1.2;
    let safe = [], risky = [];
    for (let b of bricks) {
      if (b.steel) continue;
      if (poopWarnings.some(pw => pw.brId === b.id)) continue;
      let dropX = b.x + b.w / 2;
      let risk = false;
      let fallT = POOP_WARN_DUR + (paddle.y - (b.y + b.h)) / poopV;
      let samples = [predictBallXAt(fallT), predictBallXAt(fallT * 0.7), predictBallXAt(fallT + 0.6)];
      for (let fx of samples) {
        if (fx !== null && Math.abs(dropX - fx) < dangerR) { risk = true; break; }
      }
      if (risk) risky.push(b);
      else safe.push(b);
    }
    // 安全組優先；沒有安全組才用危險組，維持遊戲仍有威脅。
    let pool = safe.length > 0 ? safe : risky;
    for (let b of pool) {
      if (Math.random() < getPoopRate()) {
        poopWarnings.push({
          brId: b.id,
          x: b.x + b.w / 2,
          y: b.y + b.h + 2,
          timer: POOP_WARN_DUR,
        });
      }
    }
  }
  // Countdown warnings → spawn poop
  for (let i = poopWarnings.length - 1; i >= 0; i--) {
    let pw = poopWarnings[i];
    pw.timer -= dt;
    // Remove if brick gone
    if (!bricks.find(b => b.id === pw.brId)) { poopWarnings.splice(i,1); continue; }
    if (pw.timer <= 0) {
      poops.push({ x: pw.x, y: pw.y, r: Math.max(9, H * 0.024), vy: H * POOP_SPD_R });
      poopWarnings.splice(i, 1);
    }
  }
  // Move poops + collision with paddle
  for (let i = poops.length - 1; i >= 0; i--) {
    let p = poops[i];
    p.y += p.vy * dt;
    if (p.y + p.r >= paddle.y && p.y - p.r <= paddle.y + paddle.h &&
        p.x + p.r >= paddle.x && p.x - p.r <= paddle.x + paddle.w) {
      // 無敵中：貓大便被彈開，不扣命、不重置球
      if (eff.shield > 0) {
        spawnParticles(p.x, p.y, '#ffd60a', 14, 1.3);
        poops.splice(i, 1);
        continue;
      }
      lives--;
      SFX.die();
      refreshHUD();
      spawnParticles(p.x, p.y, '#8B4513', 14, 1.3);
      poops.splice(i, 1);
      if (lives <= 0) { gameOver(); return; }
      balls = [makeBall()];
      continue;
    }
    if (p.y > H + 40) poops.splice(i, 1);
  }
}

// ═══════════════════════════════════════════════════
//  LEVEL GENERATOR
// ═══════════════════════════════════════════════════
let LV_DESCS = [
  '入門陣列 — 暖身一下',
  '棋盤交錯 — 雙重防護',
  '鑽石核心 — 由外到內',
  '條紋堡壘 — 逐行攻克',
  '鋼鐵障礙 — 繞道而行',
  '螺旋迷宮 — 層層推進',
  '混沌地帶 — 極限挑戰',
];

function getLvDesc(lv) {
  return LV_DESCS[Math.min(lv - 1, LV_DESCS.length - 1)] + (lv > LV_DESCS.length ? ` [LV.${lv}]` : '');
}

function genGrid(lv) {
  let pat      = (lv - 1) % 7;
  let cycle    = Math.floor((lv - 1) / 7);   // full cycles through all patterns
  let rows     = Math.min(4 + Math.floor((lv - 1) / 2), 9);
  let cols     = Math.min(10 + Math.floor((lv - 1) / 3), 14);
  let hpBonus  = cycle;
  // Ultra brick: requires (1+lv) hits — scales with level!
  let ultraHP  = 1 + lv;
  // Rate increases from ~6% at level 1 up to 45% at level 20
  let ultraRate = Math.min(0.06 + (lv - 1) * 0.022, 0.45);

  let grid  = [];
  let ultra = [];   // marks which cells are ultra bricks

  for (let r = 0; r < rows; r++) {
    grid[r]  = [];
    ultra[r] = [];
    for (let c = 0; c < cols; c++) {
      let hp = 1;

      // ── Each pattern deliberately uses ≥3 different HP values for colour variety ──
      switch (pat) {
        case 0: {
          // Tri-colour wave: HP 1, 2, 3 cycling diagonally
          hp = ((r + c) % 3) + 1;
          break;
        }
        case 1: {
          // Checkerboard with four values: HP 1–4
          hp = ((r * 2 + c) % 4) + 1;
          break;
        }
        case 2: {
          // Diamond — depth from edge determines HP (1 outside → 5 centre)
          let d = Math.min(r, rows - 1 - r, c, cols - 1 - c);
          hp = Math.min(d + 1, 5);
          break;
        }
        case 3: {
          // Stripe trio: rows alternate between 3 HP values
          let base = (r % 3) + 1;           // 1, 2, or 3
          hp = c % 2 === 0 ? Math.min(base + 1, 4) : base;
          break;
        }
        case 4: {
          // Fortress: steel core with 4-colour exterior
          let inCore = r >= 1 && r <= rows - 2 && c >= 2 && c <= cols - 3;
          hp = inCore ? 99 : ((r * cols + c) % 4) + 1;
          break;
        }
        case 5: {
          // Spiral gradient: full HP 1–5 palette
          hp = Math.min(((r * 3 + c * 2) % 5) + 1, 5);
          break;
        }
        case 6: {
          // Random mix — all five colours + occasional steel
          if (Math.random() < 0.06 + cycle * 0.01) { hp = 99; break; }
          // Weight toward mid HP for visual balance
          let w = Math.random();
          hp = w < 0.2 ? 1 : w < 0.45 ? 2 : w < 0.65 ? 3 : w < 0.82 ? 4 : 5;
          break;
        }
      }

      // Apply cycle bonus to non-steel bricks (caps at HP 5 for normal bricks)
      if (hp !== 99) hp = Math.min(hp + hpBonus, 5);

      // ── Randomly promote to ultra brick (HP = 1+level) ──
      // Only if non-steel; ultra can exceed normal max-5
      let isUltra = false;
      if (hp !== 99 && Math.random() < ultraRate) {
        hp      = ultraHP;   // e.g. HP 6 at level 5, HP 11 at level 10
        isUltra = true;
      }

      grid[r][c]  = hp;
      ultra[r][c] = isUltra;
    }
  }
  return { rows, cols, grid, ultra };
}

// ═══════════════════════════════════════════════════
//  RESIZE / INIT
// ═══════════════════════════════════════════════════
function resize() {
  let r = area.getBoundingClientRect();
  W = Math.max(1, Math.floor(r.width));
  H = Math.max(1, Math.floor(r.height));
  gc.width  = W;
  gc.height = H;
}

function initPaddle() {
  let pw = W * PW_BASE;
  // Larger minimum height so the paddle stays visible on tiny viewports
  let ph = Math.max(12, H * PH_BASE);
  paddle = {
    x: W / 2 - pw / 2,
    y: H - ph - Math.max(8, H * 0.048),
    w: pw,
    h: ph,
  };
}

function makeBall(x, y, vx, vy, launched) {
  let r = Math.max(6, H * BR_RATIO);
  return {
    x: x  !== undefined ? x : paddle.x + paddle.w / 2,
    y: y  !== undefined ? y : paddle.y - r - 1,
    r, vx: vx || 0, vy: vy || 0,
    launched: launched || false,
    trail: [],
  };
}

function getBspd() {
  let base = H * (SPD_BASE + Math.min(level - 1, 16) * 0.017);
  // AI plays 1.5× faster — makes auto-play more exciting to watch
  return aiMode ? base * 1.5 : base;
}

function initLevel() {
  resize();
  initPaddle();
  balls         = [makeBall()];
  ptcls         = [];
  drops         = [];
  lasers        = [];
  poops         = [];
  poopWarnings  = [];
  eff     = { laser: 0, wide: 0, narrow: 0, shield: 0 };
  combo   = 1;
  lastHitMs = 0;
  buildBricks();
  refreshHUD();
  refreshPUB();
}


function buildBricks() {
  bricks = [];
  let { rows, cols, grid, ultra } = genGrid(level);
  let gapX = W * 0.04;
  let topY = H * 0.038;                         // small top margin
  let bw   = (W - gapX * 2) / cols;
  let gap  = Math.max(2, bw * 0.06);

  // Bricks must all fit between topY and the paddle, with room to spare.
  // Derive the maximum brick height from the actual available canvas height
  // instead of a hard H-fraction cap — this keeps bricks visible even when
  // the viewport is very short (landscape mobile, embedded preview, etc.).
  let availH = (paddle.y - topY) * 0.93;
  let bh     = Math.max(9, Math.min(bw * 0.42, (availH - rows * gap) / rows));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let hp = grid[r][c];
      if (!hp) continue;
      let steel   = (hp === 99);
      let isUltra = ultra[r][c] === true;
      let realHp  = steel ? 999 : hp;
      bricks.push({
        x:     gapX + c * bw + gap / 2,
        y:     topY + r * (bh + gap),
        w:     bw - gap,
        h:     bh,
        hp:    realHp,
        maxHp: realHp,
        steel,
        ultra: isUltra,   // ← ultra hard brick (HP = 1+level)
        fl:    0,
        id:    r * 100 + c,
      });
    }
  }
}

function doLevel() {
  hideEl('sl');
  initLevel();
  gst    = 'playing';
  lastTS = null;
  startTimer();

  if (aiMode) {
    aiLaserTimer = 0.5;
    setTimeout(launchBalls, 200);
  }

function startTimer() {
  if (timerID) clearInterval(timerID);
  timerID = setInterval(() => {
    if (gst !== 'playing') return;
    totalSecs++;
    refreshHUD();
    refreshPUB();   // update countdown display
  }, 1000);
}

function launchBalls() {
  balls.forEach(b => {
    if (!b.launched) {
      b.launched = true;
      let spd  = getBspd();
      b.vy = -spd;
      if (aiMode) {
        let aliveTargets = bricks.filter(bk => !bk.steel);
        let leftCount = aliveTargets.filter(bk => (bk.x + bk.w / 2) < paddle.x + paddle.w / 2).length;
        let rightCount = aliveTargets.filter(bk => (bk.x + bk.w / 2) >= paddle.x + paddle.w / 2).length;
        let launchDir = leftCount > rightCount ? -1 : (rightCount > leftCount ? 1 : (paddle.x > W / 2 ? -1 : 1));
        b.vx = launchDir * spd * (0.62 + Math.random() * 0.15);
      } else {
        b.vx = (Math.random() - 0.5) * spd * 0.72;
      }
    }
  });
}

function fireLaser() {
  let lspd = H * 2.6;
  let cx2  = paddle.x + paddle.w / 2;
  lasers.push({ x: cx2,                y: paddle.y - 2, w: 5,   vy: -lspd });
  lasers.push({ x: cx2 - paddle.w*.26, y: paddle.y - 2, w: 3.5, vy: -lspd });
  lasers.push({ x: cx2 + paddle.w*.26, y: paddle.y - 2, w: 3.5, vy: -lspd });
  SFX.laser();
}

function toggleAI() {
  aiMode = !aiMode;
  let btn = document.getElementById('ai-btn');
  let bar = document.getElementById('ai-bar');
  let mob = document.getElementById('mob');

  // Immediately rescale all live balls to the new target speed
  // (aiMode is already flipped above, so getBspd() returns the right value)
  if (gst === 'playing') {
    balls.forEach(b => {
      if (!b.launched) return;
      let cur = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (cur > 0) {
        let tgt = getBspd();
        b.vx = (b.vx / cur) * tgt;
        b.vy = (b.vy / cur) * tgt;
      }
    });
  }

  if (aiMode) {
    btn.textContent = '🤖 AI：開啟';
    btn.classList.add('on');
    bar.classList.add('show');
    mob.classList.add('ai-hidden');
    aiLaserTimer = 0.3;
    if (gst === 'playing') launchBalls();
  } else {
    btn.textContent = '👤 手動';
    btn.classList.remove('on');
    bar.classList.remove('show');
    mob.classList.remove('ai-hidden');
    keyL = false; keyR = false;
    _aiPredX = null; _aiTrackedBall = null; _aiChasing = null;
  }
}

/**
 * Numerically simulate where a ball will be when it reaches targetY,
 * accounting for wall bounces.
 */
function simBallToY(bx, bvx, by, bvy, targetY, br) {
  let px = bx, pvx = bvx, py = by;
  let minX = br, maxX = W - br;
  // Use actual per-frame timestep so high-speed balls don't skip
  let DT = 1 / 120;
  for (let s = 0; s < 800; s++) {
    px += pvx * DT;
    py += bvy * DT;
    if (px < minX) { px = minX;  pvx =  Math.abs(pvx); }
    if (px > maxX) { px = maxX;  pvx = -Math.abs(pvx); }
    if (py >= targetY) return px;
  }
  return px;
}

/**
 * Simulate where ball will be at Y=targetY on the SECOND bounce
 * (used as a fallback look-ahead when ball is going up).
 */
function simBallSecondArrival(b) {
  // First simulate to ceiling then back down to paddle
  let px = b.x, pvx = b.vx, py = b.y, pvy = b.vy;
  let minX = b.r, maxX = W - b.r;
  let DT = 1 / 120;
  let hitCeiling = false;
  for (let s = 0; s < 1200; s++) {
    px += pvx * DT; py += pvy * DT;
    if (px < minX) { px = minX; pvx =  Math.abs(pvx); }
    if (px > maxX) { px = maxX; pvx = -Math.abs(pvx); }
    if (py < b.r && !hitCeiling) { py = b.r; pvy = Math.abs(pvy); hitCeiling = true; }
    if (hitCeiling && py >= paddle.y) return px;
  }
  return px;
}

/**
 * Pick the most dangerous live ball and predict where it will reach the paddle.
 * Returns { ball, predX }.
 */
// Desirability value for each power-up (higher = AI wants it more)
// Laser and wide are prioritised: laser lets the AI blast cats directly and
// wide makes both catching and aiming easier — together they are the key to
// clearing every level. Multi adds more balls = more cats hit per second.
let PU_VALUE = {
  shield: 140, laser: 120, life: 100, wide: 95, multi: 92, slow: 60, fast: 40, narrow: 2,
};

function aiPickTarget() {
  let live = balls.filter(b => b.launched);
  if (live.length === 0) return { ball: null, predX: W / 2, chasing: null };

  // ══ Step 1: Find the MOST DANGEROUS ball ══
  // Priority: balls moving DOWN (vy>0) with highest Y value (closest to paddle)
  let urgBall = null, urgScore = -Infinity;
  for (let b of live) {
    // Huge weight for downward-moving balls — survival first
    let s = b.y * 2 + (b.vy > 0 ? H * 3 : 0);
    if (s > urgScore) { urgScore = s; urgBall = b; }
  }

  // ══ Step 2: Precise prediction with wall-bounce simulation ══
  let ballPredX;
  if (urgBall.vy > 0) {
    // Ball falling → predict exact landing spot
    ballPredX = simBallToY(urgBall.x, urgBall.vx, urgBall.y, urgBall.vy, paddle.y, urgBall.r);
  } else {
    // Ball rising → predict where it'll land AFTER bouncing off ceiling
    ballPredX = simBallSecondArrival(urgBall);
  }

  // ══ Step 3: Danger level (0=totally safe, 100=critical) ══
  let danger;
  if (urgBall.vy > 0) {
    // Exponential danger curve: safe far up, critical near bottom
    let proximity = urgBall.y / paddle.y;  // 0=top, 1=at paddle
    danger = Math.pow(proximity, 1.5) * 100;
  } else {
    // Rising ball: low danger, depends on ball count
    danger = Math.max(0, 20 - live.length * 8);
  }
  // Multiple balls reduce danger — we can afford to be adventurous
  danger = Math.max(0, danger - (live.length - 1) * 20);

  // ══ Step 4: Poop avoidance (HIGH PRIORITY — survival critical) ══
  // Check ALL falling poops, not just those near the predicted landing
  let worstPoop = null, worstPoopUrgency = -Infinity;
  for (let p of poops) {
    let ttr = (paddle.y - p.y) / Math.max(p.vy, 1);  // time to reach paddle
    if (ttr < 0.1 || ttr > 2.5) continue;
    // Urgency: closer poop that's heading near our target = more dangerous
    let distFromTarget = Math.abs(p.x - ballPredX);
    let urgency = (1 / ttr) * 100 - distFromTarget * 0.1;
    if (urgency > worstPoopUrgency) { worstPoopUrgency = urgency; worstPoop = p; }
  }

  if (worstPoop) {
    // Is the poop going to land near where we need to be?
    let ttr = (paddle.y - worstPoop.y) / Math.max(worstPoop.vy, 1);
    let poopLandX = worstPoop.x;  // poops fall straight down
    let conflictRange = paddle.w * 0.8;

    if (Math.abs(poopLandX - ballPredX) < conflictRange && ttr < 1.5) {
      // CONFLICT: poop heading to same place as ball target
      // Only dodge if ball is not IMMEDIATELY critical (danger < 85)
      if (danger < 85) {
        // Move paddle to catch ball from the opposite side of the poop
        let sideOffset = paddle.w * 1.2;
        let dodgePredX = poopLandX < W * 0.5
          ? Math.min(ballPredX + sideOffset, W - paddle.w * 0.5)
          : Math.max(ballPredX - sideOffset, paddle.w * 0.5);
        // Only dodge if this keeps us close enough to still catch the ball
        if (Math.abs(dodgePredX - ballPredX) < paddle.w * 1.8) {
          ballPredX = dodgePredX;
        }
      }
    } else if (Math.abs(poopLandX - (paddle.x + paddle.w / 2)) < paddle.w * 0.6 && ttr < 0.8) {
      // Poop is about to hit our CURRENT position even if not our target
      // Emergency dodge: move paddle center 1.5 widths away from poop
      let dodge = paddle.w * 1.5;
      ballPredX = poopLandX < W * 0.5 ? poopLandX + dodge : poopLandX - dodge;
    }
  }

  // ══ Step 5: Score power-ups (chase valuable ones aggressively) ══
  let bestDrop = null, bestDropScore = -Infinity;

  // Consider power-ups whenever we're not in immediate danger. A wider window
  // than before so the AI actively grabs laser / wide / multi — the drops that
  // make full clears possible.
  if (urgBall.vy < 0 || danger < 45) {
    for (let d of drops) {
      let ttr = (paddle.y - d.y) / Math.max(d.vy, 1);
      if (ttr < 0.08 || ttr > 5.0) continue;

      let value = PU_VALUE[d.def.id] ?? 50;
      // Penalise if catching it would put us far from ball landing
      let catchX  = d.x;
      let distFromBall = Math.abs(catchX - ballPredX);
      // Reach further for high-value drops (laser/wide/multi worth a detour).
      let reach = value >= 90 ? paddle.w * 4.0 : paddle.w * 2.5;
      let reachable = distFromBall < reach;
      if (!reachable) continue;

      let distPenalty = (distFromBall / W) * 30;
      let heightBonus = (d.y / H) * 15;
      let total = value - distPenalty + heightBonus;
      if (total > bestDropScore) { bestDropScore = total; bestDrop = d; }
    }
  }

  // Chase a drop when safe. High-value drops (laser/wide/multi, score high) are
  // worth grabbing even mid-game; low-value ones only when very safe.
  let aliveTargets = bricks.filter(b => !b.steel);

  let canChase = danger < 45 && bestDropScore > 80;
  if (bestDrop && canChase) {
    return { ball: urgBall, predX: bestDrop.x, chasing: bestDrop };
  }

  // ══ Step 6: 甩板打斜角球瞄準機制（修正一大片無磚塊時打空氣直線球的問題）══
  let isFlicking = false;
  if (aliveTargets.length > 0) {
    let landX = (urgBall.vy > 0) ? ballPredX : simBallSecondArrival(urgBall);

    // 檢查球落點正上方是否有貓咪/磚塊
    let laneHalfW = Math.max(32, paddle.w * 0.35);
    let directTargets = aliveTargets.filter(b => Math.abs((b.x + b.w / 2) - landX) <= laneHalfW);
    let isLaneEmpty = directTargets.length === 0;

    // 統計落點左側與右側磚塊
    let leftTargets = aliveTargets.filter(b => (b.x + b.w / 2) < landX - 10);
    let rightTargets = aliveTargets.filter(b => (b.x + b.w / 2) > landX + 10);

    // 決定目標擊球方向：-1 為打向左邊，+1 為打向右邊
    let targetDir = 0;
    let targetBrick = null;

    if (isLaneEmpty) {
      // 一大片無磚塊的地方：必須使用甩板打出大斜角球，偏向磚塊較多的一側
      if (leftTargets.length > rightTargets.length) targetDir = -1;
      else if (rightTargets.length > leftTargets.length) targetDir = 1;
      else targetDir = landX > W * 0.5 ? -1 : 1;

      let candidatePool = targetDir === -1 ? leftTargets : rightTargets;
      if (candidatePool.length > 0) {
        targetBrick = candidatePool.reduce((best, b) => {
          let dist = Math.abs((b.x + b.w / 2) - landX);
          return dist < Math.abs((best.x + best.w / 2) - landX) ? b : best;
        }, candidatePool[0]);
      }
    } else if (Math.abs(urgBall.vx) < getBspd() * 0.25) {
      // 球呈直線上下跳動：使用甩板打破死循環
      targetDir = leftTargets.length >= rightTargets.length ? -1 : 1;
    } else {
      // 普通瞄準偏多的一側
      targetDir = leftTargets.length > rightTargets.length ? -1 : 1;
    }

    _aiTargetBrick = targetBrick || (aliveTargets.length > 0 ? aliveTargets[0] : null);

    // 甩板原理：
    // 要打非常左邊的磚塊 (targetDir = -1) -> 在球接觸板時快速往右，板子中心移到 landX 右側，球落在板子左側，反向彈出左斜角球
    // 要打非常右邊的磚塊 (targetDir = +1) -> 在球接觸板時快速往左，板子中心移到 landX 左側，球落在板子右側，反向彈出右斜角球
    let offsetRatio = isLaneEmpty ? 0.76 : 0.62;
    // desiredRel: 左斜角需 rel < 0，右斜角需 rel > 0
    let desiredRel = targetDir === -1 ? -offsetRatio : offsetRatio;
    let targetPaddleCenter = landX - desiredRel * (paddle.w / 2);

    // 甩板時機：
    // 當球仍在上方時，板子居中於落點 landX 迎球；
    // 當球接近接觸板時（0.22秒內或距離接觸板很近）快速甩動到目標位置！
    let ttr = urgBall.vy > 0 ? (paddle.y - urgBall.y) / Math.max(urgBall.vy, 1) : 999;
    if (urgBall.vy > 0 && (ttr <= 0.22 || urgBall.y >= paddle.y - paddle.h * 4)) {
      ballPredX = targetPaddleCenter;
      isFlicking = true;
    } else {
      ballPredX = landX;
    }

    // 安全邊界保護：確保球絕對落在板子安全範圍內，絕不漏球
    let maxSafeShift = (paddle.w / 2) * 0.82;
    ballPredX = Math.max(landX - maxSafeShift, Math.min(landX + maxSafeShift, ballPredX));
  } else {
    _aiTargetBrick = null;
  }

  return { ball: urgBall, predX: ballPredX, chasing: null, isFlicking };
}

// Does any destructible cat sit above one of the paddle's three laser columns?
// Used so the AI only fires the laser when it will actually hit a cat, instead
// of blasting empty space.
function aiLaserHasTarget() {
  let cx2    = paddle.x + paddle.w / 2;
  let cols   = [cx2, cx2 - paddle.w * 0.26, cx2 + paddle.w * 0.26];
  let tol    = Math.max(14, paddle.w * 0.09);  // laser beam half-width margin
  for (let br of bricks) {
    if (br.steel) continue;                    // steel cats can't be destroyed
    for (let col of cols) {
      if (col >= br.x - tol && col <= br.x + br.w + tol) return true;
    }
  }
  return false;
}

function aiControl(dt) {
  // ── Auto-launch immediately ──
  launchBalls();

  // ── Aimed laser fire: only shoot when a cat is above a laser column ──
  if (eff.laser > 0) {
    aiLaserTimer -= dt;
    if (aiLaserTimer <= 0 && aiLaserHasTarget()) {
      fireLaser();
      aiLaserTimer = 0.12 + Math.random() * 0.12;   // rapid aimed bursts
    } else if (aiLaserTimer <= 0) {
      aiLaserTimer = 0.05;
    }
  }

  // ── Get best target ──
  let { ball, predX, chasing, isFlicking } = aiPickTarget();
  _aiPredX       = predX;
  _aiTrackedBall = ball;
  _aiChasing     = chasing;

  // ── Move paddle toward target ──
  let jitter   = chasing ? 0 : Math.sin(Date.now() * 0.003) * paddle.w * 0.012;
  let targetCX = predX + jitter;
  let targetPX = Math.max(0, Math.min(W - paddle.w, targetCX - paddle.w / 2));

  let diff = targetPX - paddle.x;

  // 甩板時大幅提高移板速度與靈敏度，使接觸球瞬間產生「快速甩動」的效果
  let ballSpeed  = ball ? Math.sqrt(ball.vx ** 2 + ball.vy ** 2) : getBspd();
  let speedMult  = isFlicking ? 2.6 : (chasing ? 1.1 : Math.min(1.6, 1.2 + ballSpeed / (getBspd() * 2)));
  let maxSpd     = W * (isFlicking ? 3.2 : 1.4) * dt * speedMult;

  let distFrac = Math.min(Math.abs(diff) / (W * 0.1), 1.0);
  let move = Math.sign(diff) * Math.min(Math.abs(diff) * (isFlicking ? 2.8 : (1.2 + distFrac)), maxSpd);
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + move));
}

// ═══════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════
function update(dt) {
  // ── Effect timers ──
  if (eff.laser  > 0) { eff.laser  -= dt; if (eff.laser  < 0) { eff.laser  = 0; } }
  if (eff.wide   > 0) { eff.wide   -= dt; if (eff.wide   < 0) { eff.wide   = 0; recalcPW(); } }
  if (eff.narrow > 0) { eff.narrow -= dt; if (eff.narrow < 0) { eff.narrow = 0; recalcPW(); } }
  if (eff.shield > 0) { eff.shield -= dt; if (eff.shield < 0) { eff.shield = 0; } }

  // ── Paddle movement ──
  if (aiMode) {
    // AI takes full control of the paddle
    aiControl(dt);
  } else {
    // Human control (keyboard + mouse/touch)
    let pspd = W * 0.88 * dt;
    if (keyL) paddle.x -= pspd;
    if (keyR) paddle.x += pspd;
    if (!keyL && !keyR) {
      let tx = touchX !== null ? touchX : mouseX;
      if (tx !== null) {
        let dest = tx - paddle.w / 2;
        paddle.x += (dest - paddle.x) * 0.2;
      }
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    _aiPredX = null; _aiTrackedBall = null;
  }

  // ── Balls ──
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    let b = balls[bi];

    if (!b.launched) {
      b.x = paddle.x + paddle.w / 2;
      b.y = paddle.y - b.r - 1;
      continue;
    }

    // Trail
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 10) b.trail.shift();

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Left / right walls
    if (b.x - b.r < 0)  { b.x = b.r;   b.vx =  Math.abs(b.vx); SFX.wall(); }
    if (b.x + b.r > W)  { b.x = W-b.r;  b.vx = -Math.abs(b.vx); SFX.wall(); }
    // Ceiling
    if (b.y - b.r < 0)  { b.y = b.r;   b.vy =  Math.abs(b.vy); SFX.wall(); }

    // ── Paddle collision ──
    if (
      b.vy > 0 &&
      b.y + b.r >= paddle.y &&
      b.y - b.r <= paddle.y + paddle.h &&
      b.x + b.r >= paddle.x &&
      b.x - b.r <= paddle.x + paddle.w
    ) {
      b.y = paddle.y - b.r;
      let rel  = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);  // -1 to +1
      let spd  = getBspd();
      b.vx = rel * spd * 1.1;
      // Normalize so speed is constant
      let mag  = Math.sqrt(b.vx * b.vx + spd * spd);
      b.vx = (b.vx / mag) * spd;
      b.vy = -Math.sqrt(Math.max(0, spd * spd - b.vx * b.vx));

      SFX.pad();
      spawnParticles(b.x, paddle.y, '#00dcff', 8, 0.8);
      // Reset combo if too long since last brick hit
      if (Date.now() - lastHitMs > 2500) { combo = 1; refreshHUD(); }
    }

    // ── Brick collisions ──
    for (let i = bricks.length - 1; i >= 0; i--) {
      let br = bricks[i];
      // Circle-AABB closest point test
      let nx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      let ny = Math.max(br.y, Math.min(b.y, br.y + br.h));
      let dx = b.x - nx, dy = b.y - ny;
      if (dx * dx + dy * dy >= b.r * b.r) continue;

      // Determine bounce axis (minimum overlap)
      let oL = (b.x + b.r) - br.x;
      let oR = (br.x + br.w) - (b.x - b.r);
      let oT = (b.y + b.r) - br.y;
      let oB = (br.y + br.h) - (b.y - b.r);
      let mn = Math.min(oL, oR, oT, oB);

      if      (mn === oL) { b.x = br.x - b.r;       b.vx = -Math.abs(b.vx); }
      else if (mn === oR) { b.x = br.x + br.w + b.r; b.vx =  Math.abs(b.vx); }
      else if (mn === oT) { b.y = br.y - b.r;        b.vy = -Math.abs(b.vy); }
      else                { b.y = br.y + br.h + b.r;  b.vy =  Math.abs(b.vy); }

      hitBrick(br, i);
      break;   // one brick per ball per frame
    }

    // Lost off bottom
    if (b.y > H + 30) {
      balls.splice(bi, 1);
    }
  }

  // ── All balls gone → lose life ──
  if (balls.length === 0) {
    lives--;
    SFX.die();
    refreshHUD();
    if (lives <= 0) { gameOver(); return; }
    balls = [makeBall()];
    eff   = { laser: 0, wide: 0, narrow: 0, shield: 0 };
    recalcPW();
    refreshPUB();
  }

  // ── Lasers ──
  for (let i = lasers.length - 1; i >= 0; i--) {
    let la = lasers[i];
    la.y += la.vy * dt;
    if (la.y < -40) { lasers.splice(i, 1); continue; }

    let laserHit = false;
    for (let j = bricks.length - 1; j >= 0; j--) {
      let br = bricks[j];
      if (la.x < br.x || la.x > br.x+br.w || la.y < br.y || la.y > br.y+br.h) continue;
      spawnParticles(la.x, la.y, '#ff3d9a', 9, 1.3);
      if (!br.steel) hitBrick(br, j);
      else { br.fl = 5; SFX.hard(); }
      laserHit = true;
      break;
    }
    if (laserHit) { lasers.splice(i, 1); }
  }

  // ── Drops (power-up gems) ──
  for (let i = drops.length - 1; i >= 0; i--) {
    let p = drops[i];
    p.y   += p.vy * dt;
    p.rot += dt * 2.0;
    if (
      p.y + p.r >= paddle.y &&
      p.y - p.r <= paddle.y + paddle.h &&
      p.x       >= paddle.x &&
      p.x       <= paddle.x + paddle.w
    ) {
      applyPU(p.def);
      spawnParticles(p.x, p.y, p.def.c, 22, 1.6);
      drops.splice(i, 1);
      continue;
    }
    if (p.y > H + 30) { drops.splice(i, 1); }
  }

  // ── Particles ──
  for (let i = ptcls.length - 1; i >= 0; i--) {
    let p = ptcls[i];
    p.x   += p.vx;
    p.y   += p.vy;
    p.vy  += 0.07 * (H / 600);
    p.vx  *= 0.97;
    p.life -= p.dec;
    if (p.shard) p.ang += p.av;
    if (p.life <= 0) { ptcls.splice(i, 1); }
  }

  // ── Poop system ──
  updatePoops(dt);

  // ── Win check ──
  if (bricks.filter(b => !b.steel).length === 0) { winLevel(); }
}

// ═══════════════════════════════════════════════════
//  BRICK HIT
// ═══════════════════════════════════════════════════
function hitBrick(br, idx) {
  lastHitMs = Date.now();
  if (br.steel) { br.fl = 6; SFX.hard(); return; }

  br.hp--;
  br.fl = 8;

  if (br.hp <= 0) {
    let glow = BGLO[Math.min(br.maxHp, 5)] || '#00e5ff';
    spawnShards(br.x + br.w/2, br.y + br.h/2, glow);
    spawnParticles(br.x + br.w/2, br.y + br.h/2, glow, 16, 1.4);
    tryDropPU(br.x + br.w/2, br.y + br.h/2);
    score  += br.maxHp * 100 * combo;
    combo++;
    bricks.splice(idx, 1);
    SFX.brk();
    refreshHUD();
    if (combo >= 3) showComboFX();
  } else {
    SFX.hit();
  }
}

// ═══════════════════════════════════════════════════
//  POWER-UPS
// ═══════════════════════════════════════════════════
function recalcPW() {
  let w = W * PW_BASE;
  if (eff.wide   > 0) w = W * PW_BASE * 1.65;
  if (eff.narrow > 0) w = W * PW_BASE * 0.55;
  paddle.w = w;
}

// ── 動態掉落率平衡 ──
// 每款道具有「基礎掉落率 rate」與「有效掉落率 effRate」。掉落判定用 effRate：
//   · 某道具實際掉落後 → 該道具 effRate 減少（基礎率的 10%），比較不容易再掉。
//   · 其餘沒掉的道具    → effRate 增加（各自基礎率的 10%），比較容易掉。
// 讓道具種類隨遊戲進行更均衡地輪流出現。effRate 夾在 [0, 基礎率×3] 避免失衡。
function adjustDropRates(droppedId) {
  for (let d of PU_DEFS) {
    if (d.effRate === undefined) d.effRate = d.rate;
    let step = d.rate * 0.10;                 // 以各自基礎率的 10% 為調整步長
    if (d.id === droppedId) d.effRate -= step;  // 掉過的：下次更難再掉
    else                    d.effRate += step;  // 沒掉的：下次更容易掉
    d.effRate = Math.max(0, Math.min(d.rate * 3, d.effRate));
  }
}

function tryDropPU(x, y) {
  for (let d of PU_DEFS) {
    let r = (d.effRate === undefined) ? d.rate : d.effRate;
    if (Math.random() < r) {
      drops.push({
        x, y,
        r:   Math.max(12, H * 0.017),
        vy:  H * 0.18,
        rot: 0,
        def: d,
      });
      adjustDropRates(d.id);   // 更新所有道具的有效掉落率
      break;  // max 1 drop per brick
    }
  }
}

function applyPU(def) {
  SFX.pu();
  switch (def.id) {
    case 'laser':
      eff.laser = PU_DUR;
      break;
    case 'wide':
      eff.wide    = PU_DUR;
      paddle.w    = W * PW_BASE * 1.65;
      break;
    case 'narrow':
      eff.narrow  = PU_DUR;
      paddle.w    = W * PW_BASE * 0.55;
      break;
    case 'life':
      lives = Math.min(lives + 1, 7);
      refreshHUD();
      break;
    case 'shield':
      eff.shield = 5;   // 無敵持續 5 秒
      break;
    case 'multi': {
      if (balls.length < 6) {
        let ref = balls[0];
        if (!ref) break;
        let spd = getBspd();
        balls.push(makeBall(ref.x, ref.y,  spd * 0.68, -spd * 0.73, true));
        balls.push(makeBall(ref.x, ref.y, -spd * 0.68, -spd * 0.73, true));
      }
      break;
    }
    case 'fast':
      balls.forEach(b => { b.vx *= 1.35; b.vy *= 1.35; });
      break;
    case 'slow':
      balls.forEach(b => { b.vx *= 0.65; b.vy *= 0.65; });
      break;
  }
  refreshPUB();
}

// ═══════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════
function spawnParticles(x, y, c, n, sm) {
  let sc = (H / 600) * (sm || 1);
  for (let i = 0; i < n; i++) {
    let a   = Math.random() * Math.PI * 2;
    let spd = (Math.random() * 2.5 + 0.5) * sc;
    ptcls.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - 0.5,
      r: Math.random() * 3 + 1,
      life: 1,
      dec:  Math.random() * 0.028 + 0.018,
      c,
      glow: true,
    });
  }
}

function spawnShards(x, y, c) {
  let sc = H / 600;
  for (let i = 0; i < 9; i++) {
    ptcls.push({
      x: x + (Math.random() - 0.5) * 18,
      y: y + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 5 * sc,
      vy: (Math.random() - 0.75) * 5 * sc,
      w:  Math.random() * 10 + 4,
      ht: Math.random() * 4  + 2,
      life: 1,
      dec:  Math.random() * 0.02 + 0.02,
      c,
      shard: true,
      ang: Math.random() * Math.PI * 2,
      av:  (Math.random() - 0.5) * 0.28,
    });
  }
}

let cpopEl = document.getElementById('cpop');
let comboFXTimer = null;

function showComboFX() {
  cpopEl.style.fontSize = Math.min(22 + combo * 2, 46) + 'px';
  cpopEl.style.color    = combo >= 9 ? '#ffd60a' : combo >= 6 ? '#ff3d9a' : '#a855f7';
  cpopEl.textContent    = `連擊 ×${combo}`;
  cpopEl.style.opacity  = '1';
  clearTimeout(comboFXTimer);
  comboFXTimer = setTimeout(() => { cpopEl.style.opacity = '0'; }, 750);
  SFX.combo(combo);
}

// ═══════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════
function refreshHUD() {
  document.getElementById('hs').textContent   = score.toLocaleString();
  document.getElementById('hlvl').textContent = level;
  document.getElementById('ht').textContent   = fmtT(totalSecs);

  // Lives dots
  let lv = document.getElementById('hlv');
  lv.innerHTML = '';
  let show3 = Math.max(3, lives);
  for (let i = 0; i < show3; i++) {
    let d = document.createElement('div');
    if (i >= lives)  { d.className = 'ld off'; }
    else if (i >= 3) { d.className = 'ld gold'; }
    else             { d.className = 'ld'; }
    lv.appendChild(d);
  }

  // Combo HUD
  let ce = document.getElementById('hc');
  ce.textContent   = `×${combo}`;
  ce.style.color   = combo >= 9 ? '#ffd60a' : combo >= 6 ? '#ff3d9a' : combo >= 3 ? '#a855f7' : '#fff';
  ce.style.textShadow = combo >= 3 ? '0 0 8px currentColor' : 'none';
}

function refreshPUB() {
  let bar = document.getElementById('pub');
  bar.innerHTML = '';
  let add = (lbl, c, bg, t) => {
    let el = document.createElement('div');
    el.className = 'pib';
    el.style.cssText = `background:${bg};border:1px solid ${c};color:${c}`;
    el.textContent   = lbl + ' ' + Math.max(0, Math.ceil(t)) + 's';
    bar.appendChild(el);
  };
  if (eff.shield > 0) add('🛡 無敵', '#ffd60a', 'rgba(255,214,10,0.18)',  eff.shield);
  if (eff.laser  > 0) add('⚡ 雷射',  '#ff3d9a', 'rgba(255,61,154,0.18)', eff.laser);
  if (eff.wide   > 0) add('↔ 加寬',   '#00dcff', 'rgba(0,220,255,0.15)',   eff.wide);
  if (eff.narrow > 0) add('↕ 縮窄', '#fb5607', 'rgba(251,86,7,0.15)',    eff.narrow);
}

// ═══════════════════════════════════════════════════
//  GAME OVER / WIN
// ═══════════════════════════════════════════════════
function gameOver() {
  gst = 'over';
  clearInterval(timerID);
  document.getElementById('go-s').textContent = score.toLocaleString();
  document.getElementById('go-l').textContent = level;
  document.getElementById('go-t').textContent = fmtT(totalSecs);
  if (aiMode) {
    // AI mourns briefly then restarts
    setTimeout(() => {
      hideEl('so');
      score=0; lives=3; level=1; totalSecs=0; combo=1;
      showLvl();
    }, 3200);
    setTimeout(() => showEl('so'), 350);
  } else {
    setTimeout(() => showEl('so'), 350);
  }
}

function winLevel() {
  if (gst !== 'playing') return;
  gst = 'win';
  clearInterval(timerID);
  SFX.clear();

  // Confetti burst
  let ci = 0;
  let burst = setInterval(() => {
    let c = ['#00dcff','#ff3d9a','#ffd60a','#a855f7','#00e676'][Math.floor(Math.random()*5)];
    spawnParticles(Math.random()*W, Math.random()*H*0.6, c, 6, 2.0);
    if (++ci > 90) clearInterval(burst);
  }, 20);

  document.getElementById('wn-s').textContent = score.toLocaleString();
  document.getElementById('wn-t').textContent = fmtT(totalSecs);

  if (aiMode) {
    // AI auto-advances to next level after a short celebration pause
    setTimeout(() => { hideEl('sw'); level++; showLvl(); }, 2800);
    setTimeout(() => showEl('sw'), 1600);
  } else {
    setTimeout(() => showEl('sw'), 1600);
  }
}
