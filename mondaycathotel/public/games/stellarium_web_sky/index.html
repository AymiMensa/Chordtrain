<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Stellarium Web Sky - 實時星空天文模擬器</title>
    <meta name="description" content="基於 Three.js 高性能渲染的實時星空天球模擬器，支持全球經緯度精確定位、88星座連線與圖案、行星軌跡、深空天體搜索與多端自適應介面。" />
    <meta property="og:title" content="Stellarium Web Sky - 實時星空天文模擬器" />
    <meta property="og:description" content="基於 Three.js 高性能渲染的實時星空天球模擬器，支持全球經緯度精確定位、88星座連線與圖案、行星軌跡、深空天體搜索與多端自適應介面。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --morandi-color: #B89495;
      }
      
      /* 確保 iframe 內容不會溢出父容器 */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }
      
      /* 舞台容器 - 置中設計，內容超高時自動拉長不裁切 */
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto;
      }
      
      /* 滿版舞台 - 會自動拉長但不會裁切 */
      .stage {
        width: 100%;
        min-height: 100%;
        max-width: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      /* 遊戲按鈕自動換行 */
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 8px;
      }
      
      /* 按鈕基礎樣式 */
      .btn {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 12px;
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      
      /* 响应式断点 */
      @media (max-width: 560px) {
        .stage {
          min-height: 200px;
        }
        .btn {
          font-size: 10px;
          padding: 4px 8px;
        }
      }
      
      @media (min-width: 561px) and (max-width: 1024px) {
        .stage {
          min-height: 300px;
        }
        .btn {
          font-size: 11px;
          padding: 5px 10px;
        }
      }
      
      @media (min-width: 1025px) {
        .stage {
          min-height: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="stage">
        <script type="module" src="/src/main.tsx"></script>
      </div>
    </div>
  </body>
</html>
